    <div id="calc2Result"></div>
  `;
}

function attachCamfitCalc2Handlers() {
  // 일부 항목(b2bRate·campMargin·pg)은 단가 시뮬레이터와 입력칸을 공유한다 → 한쪽을 고치면 다른 쪽도 갱신
  const map = {c2Camps:'camps',c2Pg:'pg',c2Deliver:'deliverPerCamp',c2B2bRate:'b2bRate',c2Spend:'avgSpend',c2Resv:'resv',c2Adopt:'adopt',c2CampMargin:'campMargin',c2OpFee:'uOpFee',
               c2uSupply:'uSupply',c2uB2b:'b2bRate',c2uCampMargin:'campMargin',c2uOpFee:'uOpFee',c2uPg:'pg',c2uUpRate:'uUpRate',
               c2gSupply:'gSupply',c2gOpFee:'gOpFee',c2gPg:'pg',c2gRs:'gRs'};
  const sync = (ev) => {
    const srcId = ev && ev.target ? ev.target.id : null;
    if (srcId && map[srcId]) {
      calcState2[map[srcId]] = parseNum(document.getElementById(srcId).value);
    } else {
      Object.entries(map).forEach(([k,v]) => {
        const el = document.getElementById(k);
        if (el) calcState2[v] = parseNum(el.value);
      });
    }
    // 같은 값을 쓰는 반대편 입력칸에 반영 (편집 중인 칸은 건드리지 않음 — 커서 튐 방지)
    Object.entries(map).forEach(([k,v]) => {
      if (k === srcId) return;
      const el = document.getElementById(k);
      if (!el) return;
      const isMoney = el.type === 'text';
      const shown = isMoney ? fmtNum(calcState2[v]) : String(calcState2[v]);
      if (el.value !== shown) el.value = shown;
    });
    const pay = document.getElementById('c2B2bPay');
    if (pay) calcState2.b2bPay = pay.value;
    const rnd = document.getElementById('c2uRound');
    if (rnd) calcState2.uRound = parseInt(rnd.value, 10);
    const grd = document.getElementById('c2gRound');
    if (grd) calcState2.gRound = parseInt(grd.value, 10);
    const md = document.getElementById('c2uMode');
    if (md && md.value !== calcState2.uMode) { calcState2.uMode = md.value; render(); return; }
    updateCamfitCalc2();
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', sync);
  });
  ['c2B2bPay','c2uRound','c2uMode','c2gRound'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', sync);
  });
  attachNumFormat(['c2uSupply','c2gSupply','c2Camps','c2Deliver','c2Spend','c2Resv']);
  sync();   // 새로고침 시 DOM에 남은 값을 state로 먼저 맞춘다 (RS버전과 동일)
}

// 일반셀러(신선·직배) 판매가 시뮬레이터 — B2B 납품 없음 / 캠핑장은 보관비(RS)만
function updateCalc2General() {
  const s = calcState2;
  const box = document.getElementById('calc2Gen');
  if (!box) return;

  const b   = s.gOpFee/100;
  const sup = s.gSupply;                              // 일반셀러 공급가 = 셀러 정산 목표
  const rawP = b < 1 ? sup/(1-b) : 0;                 // 판매가(자릿수 처리 전)
  const price = r10(rawP, s.gRound);
  const RM = {2:'올림', 1:'반올림', 0:'미적용'}[s.gRound] || '올림';

  const fee    = price * b;                           // 서비스 이용료 (정확)
  const settle = price - fee;                         // 일반셀러 정산액
  const pg     = price * s.pg/100;
  const rsAmt  = price * s.gRs/100;                   // 캠핑장 보관비
  const camfit = fee - pg - rsAmt;                    // 캠핏이익금 = 잔여
  const be     = s.pg + s.gRs;                        // 손익분기 서비스 이용료율

  const C = {sup:'#6b7280', camfit:'#0d9488', camp:'#ea580c', price:'#2563eb', pg:'#db2777'};
  const w  = n => (Math.round(n*100)/100).toLocaleString('ko-KR') + '원';
  const w0 = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const seg = (v,base,c) => (base>0 && v>0) ? `<div style="width:${Math.min(100,(v/base)*100)}%;background:${c};" class="h-full"></div>` : '';
  const warn = m => `<p class="text-xs mt-2" style="color:#b91c1c;">⚠️ ${m}</p>`;
  const step = (no,label,formula,amount,color,sub,pctW) => `
    <div class="flex items-center gap-3 py-2.5">
      <div class="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold text-white leading-none" style="background:${color};">${no}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-3">
          <div class="text-sm font-semibold text-gray-800 truncate">${label}</div>
          <div class="text-lg font-bold tabular-nums shrink-0" style="color:${color};">${amount}</div>
        </div>
        <div class="h-1.5 rounded-full mt-1.5" style="background:#e5e7eb;"><div class="h-full rounded-full" style="width:${pctW}%;background:${color};opacity:.55;"></div></div>
        <div class="flex items-baseline justify-between gap-3 mt-1">
          <div class="text-[11px] font-mono text-gray-400 truncate">${formula}</div>
          <div class="text-[11px] shrink-0" style="color:${color};">${sub}</div>
        </div>
      </div>
    </div>`;
  const leaf = (depth,label,amount,color,note,strong) => `
    <div class="flex items-center gap-2 py-1.5" style="padding-left:${depth*22}px;">
      ${depth ? `<span class="text-gray-300 font-mono text-xs shrink-0">└</span>` : ''}
      <span class="inline-block w-2.5 h-2.5 rounded-sm shrink-0" style="background:${color};"></span>
      <span class="text-xs ${strong?'font-bold text-gray-900':'text-gray-600'} shrink-0">${label}</span>
      <span class="flex-1 border-b border-dotted border-gray-200 mx-1"></span>
      <span class="text-sm ${strong?'font-bold':'font-semibold'} tabular-nums shrink-0" style="color:${color};">${amount}</span>
      ${note ? `<span class="text-[11px] text-gray-400 shrink-0 w-20 text-right">${note}</span>` : '<span class="w-20 shrink-0"></span>'}
    </div>`;

  box.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">가격이 만들어지는 과정</div>
        <div class="text-[11px] text-gray-500 mb-2">공급가에서 서비스 이용료만큼 역산하면 끝 — 2단계</div>
        <div class="divide-y divide-gray-100">
          ${step(1,'공급사(일반셀러) 공급가','셀러가 받아야 할 금액', w0(sup), C.sup, '', sup/(price||1)*100)}
          ${step(2,'온라인 판매가', `공급가 ÷ (1 − ${s.gOpFee}%)${s.gRound?` → 10원 ${RM}`:''}`, s.gRound?w0(price):w(price), C.price, s.gRound?`${w(rawP)} ${RM}`:'', 100)}
        </div>
      </div>

      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">캠퍼가 낸 ${w0(price)}이 나뉘는 과정</div>
        <div class="text-[11px] text-gray-500 mb-2">서비스 이용료 하나가 3갈래로</div>
        <div class="rounded-lg px-3 py-2 mb-1 flex items-center justify-between" style="background:#eff6ff;">
          <span class="text-xs font-bold" style="color:#1d4ed8;">캠퍼 결제</span>
          <span class="text-lg font-bold tabular-nums" style="color:${C.price};">${w0(price)}</span>
        </div>
        ${leaf(1,'서비스 이용료', w(fee), C.camfit, `${s.gOpFee}%`, true)}
        ${leaf(2,'PG', w(pg), C.pg, `${s.pg}%`, false)}
        ${leaf(2,'캠핑장 보관비(RS)', w(rsAmt), C.camp, `${s.gRs}%`, true)}
        ${leaf(2,'캠핏이익금', w(camfit), C.camfit, `${(camfit/price*100).toFixed(2)}%`, true)}
        ${leaf(1,'일반셀러 정산', w(settle), C.sup, `${(settle/price*100).toFixed(1)}%`, true)}
      </div>
    </div>

    <div class="mt-4 rounded-xl p-4" style="background:#f9fafb;border:1px solid #e5e7eb;">
      <div class="text-xs font-bold text-gray-700 mb-3">결국 이 상품 1개에서 누가 얼마를 갖나 <span class="font-normal text-gray-400">(판매가 ${w0(price)} 기준)</span></div>
      <div class="flex h-8 rounded-lg overflow-hidden border border-gray-200 mb-3">
        ${seg(settle,price,'#d1d5db')}${seg(rsAmt,price,C.camp)}${seg(pg,price,C.pg)}${seg(camfit,price,C.camfit)}
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="rounded-lg p-3" style="background:#f0fdfa;">
          <div class="text-[11px] font-semibold" style="color:${C.camfit};">캠핏이익금</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#115e59;">${w(camfit)}</div>
          <div class="text-[11px] text-gray-500 mt-0.5">서비스 이용료 − PG − 보관비</div>
          <div class="text-[11px] text-gray-500">판매가의 ${(camfit/price*100).toFixed(2)}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#fff7ed;">
          <div class="text-[11px] font-semibold" style="color:${C.camp};">캠핑장 보관비</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#9a3412;">${w(rsAmt)}</div>
          <div class="text-[11px] text-orange-700 mt-0.5">재고 매입 없음 · 보관·픽업 대가</div>
          <div class="text-[11px] text-gray-500">판매가의 ${s.gRs}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#fdf2f8;">
          <div class="text-[11px] font-semibold" style="color:${C.pg};">PG사</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#9d174d;">${w(pg)}</div>
          <div class="text-[11px] text-pink-700 mt-0.5">캠핏 부담</div>
          <div class="text-[11px] text-gray-500">판매가의 ${s.pg}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#f3f4f6;">
          <div class="text-[11px] font-semibold text-gray-600">일반셀러</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap text-gray-700">${w(settle)}</div>
          <div class="text-[11px] text-gray-500 mt-0.5">공급가 회수</div>
          <div class="text-[11px] text-gray-500">판매가의 ${(settle/price*100).toFixed(2)}%</div>
        </div>
      </div>
    </div>

    <div class="mt-3 rounded-lg px-3 py-2 text-xs" style="background:${s.gOpFee>=be?'#f0fdf4':'#fef2f2'};color:${s.gOpFee>=be?'#15803d':'#b91c1c'};">
      손익분기 서비스 이용료율 = PG ${s.pg}% + 보관비 ${s.gRs}% = <b>${be.toFixed(2)}%</b> · 현재 <b>${s.gOpFee}%</b> → ${s.gOpFee>=be?'✅ 흑자권':'❌ 적자'}
      <span style="color:#6b7280;"> · 숙소셀러는 RS가 없어 손익분기가 PG(${s.pg}%)뿐이지만, 일반셀러는 보관비까지 덮어야 합니다.</span>
    </div>
    ${camfit < 0 ? warn(`서비스 이용료 ${s.gOpFee}%가 <b>PG + 보관비(${be.toFixed(2)}%)</b>에 못 미쳐 캠핏이익금이 마이너스입니다.`) : ''}
  `;
}

// 단가 시뮬레이터 — 판매가에서 서비스 이용료 공제 → 캠핑장 정산 (2026-07-30 확정)
function updateCalc2Unit() {
  const s = calcState2;
  const box = document.getElementById('calc2Unit');
  if (!box) return;

  const b      = s.uOpFee / 100;                       // 서비스 이용료율 (판매가를 정하는 계수)
  const supply = s.uSupply;                            // 공급사 공급가
  const deliv  = supply * (1 + s.b2bRate/100);         // 캠핑장 납품가
  // ★ 서비스 이용료율을 고정한다 — 약관·정산서에 "판매가의 N%"로 명시되므로 정확해야 한다.
  //   판매가 10원 반올림 오차는 캠핑장 마진이 흡수한다(목표 %에서 소폭 흔들림).
  const upMode = s.uMode === 'up';
  // 업률 모드: 판매가를 먼저 정하고 캠핑장 마진이 결과로 나온다
  // 마진 모드: 캠핑장 마진을 먼저 정하고 판매가가 결과로 나온다
  const rawP   = upMode ? deliv * (1 + s.uUpRate/100)
                        : (b < 1 ? deliv * (1 + s.campMargin/100) / (1 - b) : 0);
  const settle0= upMode ? rawP * (1 - b) : deliv * (1 + s.campMargin/100);
  const price  = r10(rawP, s.uRound);
  const RMODE  = {2:'올림', 1:'반올림', 0:'미적용'}[s.uRound] || '반올림';

  const fee    = price * b;                            // 서비스 이용료 = 판매가 × 요율 (정확)
  const feeRate= s.uOpFee;                             // 실효 = 설정값과 동일
  const settle = price - fee;                          // 캠핑장 정산액 = 잔여
  const cMargin= settle - deliv;                       // 캠핑장 마진
  const cmRate = deliv > 0 ? cMargin/deliv*100 : 0;    // 실제 캠핑장 마진율
  const pg     = price * s.pg/100;
  const camfitOn = fee - pg;                           // 캠핏이익금(온라인)
  const camfitB2b= deliv - supply;                     // 캠핏 납품 마진
  const upRate = settle > 0 ? (price/settle - 1) * 100 : 0;   // 정산액 → 판매가 업률

  const w  = n => (Math.round(n*100)/100).toLocaleString('ko-KR') + '원';
  const w0 = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const d  = (n) => `<span style="color:${n>=0?'#1565c0':'#c62828'};">${n>=0?'+':''}${w(n)}</span>`;
  const seg = (v,base,c) => (base>0 && v>0) ? `<div style="width:${Math.min(100,(v/base)*100)}%;background:${c};" class="h-full"></div>` : '';
  const warn = m => `<p class="text-xs mt-2" style="color:#b91c1c;">⚠️ ${m}</p>`;

  // ── 색상 규칙: 공급사=회색 / 캠핏=보라 / 캠핑장=주황 / 판매가·캠퍼=파랑 / PG=핑크
  const C = {sup:'#6b7280', camfit:'#7c3aed', camp:'#ea580c', price:'#2563eb', pg:'#db2777'};

  // 가격 사다리 한 칸
  const step = (no, label, formula, amount, color, sub, isMax) => `
    <div class="flex items-center gap-3 py-2.5">
      <div class="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold text-white leading-none" style="background:${color};">${no}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-3">
          <div class="text-sm font-semibold text-gray-800 truncate">${label}</div>
          <div class="text-lg font-bold tabular-nums shrink-0" style="color:${color};">${amount}</div>
        </div>
        <div class="h-1.5 rounded-full mt-1.5" style="background:#e5e7eb;">
          <div class="h-full rounded-full" style="width:${isMax}%;background:${color};opacity:.55;"></div>
        </div>
        <div class="flex items-baseline justify-between gap-3 mt-1">
          <div class="text-[11px] font-mono text-gray-400 truncate">${formula}</div>
          <div class="text-[11px] shrink-0" style="color:${color};">${sub}</div>
        </div>
      </div>
    </div>`;

  // 분배 트리 한 줄
  const leaf = (depth, label, amount, color, note, strong) => `
    <div class="flex items-center gap-2 py-1.5" style="padding-left:${depth*22}px;">
      ${depth ? `<span class="text-gray-300 font-mono text-xs shrink-0">└</span>` : ''}
      <span class="inline-block w-2.5 h-2.5 rounded-sm shrink-0" style="background:${color};"></span>
      <span class="text-xs ${strong?'font-bold text-gray-900':'text-gray-600'} shrink-0">${label}</span>
      <span class="flex-1 border-b border-dotted border-gray-200 mx-1"></span>
      <span class="text-sm ${strong?'font-bold':'font-semibold'} tabular-nums shrink-0" style="color:${color};">${amount}</span>
      ${note ? `<span class="text-[11px] text-gray-400 shrink-0 w-20 text-right">${note}</span>` : '<span class="w-20 shrink-0"></span>'}
    </div>`;

  const maxV = Math.max(price, deliv, settle, supply) || 1;
  const ladder = upMode
    ? step(1,'공급사 공급가','기준', w0(supply), C.sup, '', supply/maxV*100)
      + step(2,'캠핑장 납품가', `공급가 × (1 + ${s.b2bRate}%)`, w0(deliv), C.camfit, `캠핏 납품 마진 +${w0(camfitB2b)}`, deliv/maxV*100)
      + step(3,'온라인 판매가 <span class="text-[10px] font-normal px-1 rounded" style="background:#dbeafe;color:#1d4ed8;">입력</span>', `납품가 × (1 + ${s.uUpRate}%)${s.uRound?` → 10원 ${RMODE}`:''}`, w0(price), C.price, s.uRound?`${w(rawP)} ${RMODE}`:'', price/maxV*100)
    : step(1,'공급사 공급가','기준', w0(supply), C.sup, '', supply/maxV*100)
      + step(2,'캠핑장 납품가', `공급가 × (1 + ${s.b2bRate}%)`, w0(deliv), C.camfit, `캠핏 납품 마진 +${w0(camfitB2b)}`, deliv/maxV*100)
      + step(3,'캠핑장 정산가', `캠핑장 납품가 + 캠핑장 마진(${s.campMargin}%)`, w(settle0), C.camp, `마진 +${w(settle0-deliv)} · 판매가 대비 ${price>0?(cMargin/price*100).toFixed(2):'0.00'}%`, settle0/maxV*100)
      + step(4,'온라인 판매가 <span class="text-[10px] font-normal px-1 rounded" style="background:#dbeafe;color:#1d4ed8;">결과</span>', `캠핑장 정산가 ÷ (1 − ${s.uOpFee}%)${s.uRound?` → 10원 ${RMODE}`:''}`, w0(price), C.price, s.uRound?`${w(rawP)} ${RMODE}`:'', price/maxV*100);

  box.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

      <!-- 왼쪽: 가격이 쌓이는 과정 -->
      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">가격이 만들어지는 과정</div>
        <div class="text-[11px] text-gray-500 mb-2">아래로 갈수록 가격이 쌓입니다</div>
        <div class="divide-y divide-gray-100">${ladder}</div>
      </div>

      <!-- 오른쪽: 결제액이 나뉘는 과정 -->
      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">캠퍼가 낸 ${w0(price)}이 나뉘는 과정</div>
        <div class="text-[11px] text-gray-500 mb-2">먼저 2갈래, 각각 다시 2갈래</div>

        <div class="rounded-lg px-3 py-2 mb-1 flex items-center justify-between" style="background:#eff6ff;">
          <span class="text-xs font-bold" style="color:#1d4ed8;">캠퍼 결제</span>
          <span class="text-lg font-bold tabular-nums" style="color:${C.price};">${w0(price)}</span>
        </div>

        ${leaf(1, `서비스 이용료`, w(fee), C.camfit, `${s.uOpFee}%`, true)}
        ${leaf(2, `PG`, w(pg), C.pg, `${s.pg}%`, false)}
        ${leaf(2, `캠핏이익금`, w(camfitOn), C.camfit, `${(camfitOn/price*100).toFixed(1)}%`, true)}
        ${leaf(1, `캠핑장 정산가`, w(settle), C.camp, `${(settle/price*100).toFixed(1)}%`, true)}
        ${leaf(2, `납품가 회수 <span class="text-gray-400">(이익 아님)</span>`, w0(deliv), C.sup, '', false)}
        ${leaf(2, `캠핑장 마진`, w(cMargin), C.camp, `납품가 ${cmRate.toFixed(2)}%`, true)}
        ${leaf(3, `<span class="text-gray-400">판매가 대비</span>`, `<span class="text-gray-500">${price>0?(cMargin/price*100).toFixed(2):'0.00'}%</span>`, '#e5e7eb', '', false)}
      </div>
    </div>

    <!-- 결국 누가 얼마를 갖나 -->
    <div class="mt-4 rounded-xl p-4" style="background:#f9fafb;border:1px solid #e5e7eb;">
      <div class="text-xs font-bold text-gray-700 mb-3">결국 이 상품 1개에서 누가 얼마를 갖나 <span class="font-normal text-gray-400">(판매가 ${w0(price)} 기준)</span></div>
      <div class="flex h-8 rounded-lg overflow-hidden border border-gray-200 mb-3">
        ${seg(supply,price,'#d1d5db')}${seg(camfitB2b,price,C.camfit)}${seg(cMargin,price,C.camp)}${seg(pg,price,C.pg)}${seg(camfitOn,price,'#3b82f6')}
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="rounded-lg p-3" style="background:#f3e8ff;">
          <div class="text-[11px] font-semibold" style="color:${C.camfit};">캠핏 합계</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#5b21b6;">${w(camfitB2b + camfitOn)}</div>
          <div class="text-[11px] text-purple-700 mt-0.5">납품 ${w0(camfitB2b)} + 온라인 ${w(camfitOn)}</div>
          <div class="text-[11px] text-gray-500">판매가의 ${((camfitB2b+camfitOn)/price*100).toFixed(2)}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#fff7ed;">
          <div class="text-[11px] font-semibold" style="color:${C.camp};">캠핑장</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#9a3412;">${w(cMargin)}</div>
          <div class="text-[11px] text-orange-700 mt-0.5">납품가 ${w0(deliv)}은 원가 회수</div>
          <div class="text-[11px] text-gray-500">판매가의 ${(cMargin/price*100).toFixed(2)}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#fdf2f8;">
          <div class="text-[11px] font-semibold" style="color:${C.pg};">PG사</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#9d174d;">${w(pg)}</div>
          <div class="text-[11px] text-pink-700 mt-0.5">캠핏 부담</div>
          <div class="text-[11px] text-gray-500">판매가의 ${s.pg}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#f3f4f6;">
          <div class="text-[11px] font-semibold text-gray-600">공급사</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap text-gray-700">${w0(supply)}</div>
          <div class="text-[11px] text-gray-500 mt-0.5">상품 원가</div>
          <div class="text-[11px] text-gray-500">판매가의 ${(supply/price*100).toFixed(2)}%</div>
        </div>
      </div>
    </div>

    ${!upMode && s.uRound && Math.abs(cmRate - s.campMargin) > 0.001
      ? `<p class="text-xs mt-3" style="color:${s.uRound===2?'#15803d':'#b45309'};">※ 10원 ${RMODE} 때문에 캠핑장 마진이 목표 ${s.campMargin}% → <b>${cmRate.toFixed(2)}%</b>가 됐습니다. <b>서비스 이용료 ${s.uOpFee}%는 그대로</b>입니다.${s.uRound===2?' 올림이라 <b>목표 아래로는 내려가지 않습니다</b>.':''}</p>`
      : ''}
    ${upMode ? (() => {
        const theo = (((1+s.uUpRate/100)*(1-b))-1)*100;   // 반올림 전 이론값
        const gap  = Math.abs(cmRate - theo) > 0.005;
        return `<p class="text-xs mt-3" style="color:#6b7280;">※ 캠핑장 마진율 = (1 + 업률) × (1 − 서비스 이용료율) − 1 = <b>${theo.toFixed(2)}%</b>${gap ? ` <span style="color:#b45309;">→ 10원 ${RMODE} 반영 후 실제 <b>${cmRate.toFixed(2)}%</b></span>` : ''} · 마진 0이 되는 업률 = <b>${((1/(1-b)-1)*100).toFixed(2)}%</b></p>`;
      })() : ''}
    ${camfitOn < 0 ? warn(`서비스 이용료가 PG(${w(pg)})보다 작아 <b>캠핏이익금이 마이너스</b>입니다. 손익분기 서비스 이용료율 = <b>${s.pg}%</b>.`) : ''}
    ${cMargin < 0 ? warn(`캠핑장 마진이 <b>마이너스</b>입니다. ${upMode ? `업률을 <b>${((1/(1-b)-1)*100).toFixed(2)}%</b> 위로 올리거나 ` : ''}서비스 이용료율을 낮추세요.`) : ''}
  `;
}

function updateCamfitCalc2() {
  const s = calcState2;
  // ★ 업률 모드에서는 캠핑장 마진율이 '결과값'이므로, 아래 월 총액 계산도 그 값을 따라가야 한다
  //   (안 맞추면 단가 블록과 월 블록이 서로 다른 마진율로 계산됨)
  if (s.uMode === 'up') {
    s.campMargin = Math.round(((1 + s.uUpRate/100) * (1 - s.uOpFee/100) - 1) * 10000) / 100;
  }
  updateCalc2Unit();
  updateCalc2General();

  // A. 납품(B2B) — RS버전과 완전 동일
  const deliverTot = s.deliverPerCamp * s.camps;
  const b2bGross   = deliverTot * s.b2bRate/100;
  const b2bCard    = s.b2bPay === 'card';
  const b2bPg      = b2bCard ? deliverTot * s.pg/100 : 0;
  const b2bCost    = deliverTot - b2bGross;
  const b2bNet     = b2bGross - b2bPg;

  // B. 온라인 — 2026-07-31 확정 구조: 거래액에서 서비스 이용료를 떼고, 나머지가 캠핑장 정산액
  const GMV       = s.avgSpend * s.resv * s.camps * (s.adopt/100);  // 거래액 = 캠퍼 결제 총액
  const opFee     = GMV * s.uOpFee/100;                             // 서비스 이용료 (판매가 기준, 정확)
  const settleTot = GMV - opFee;                                    // 캠핑장 정산액 총액
  const deliver   = settleTot / (1 + s.campMargin/100);             // 캠핑장 구입원가 회수분
  const campAmt   = settleTot - deliver;                            // 캠핑장 마진
  const onPg      = GMV * s.pg/100;
  const onNet     = opFee - onPg;                                   // 캠핏 온라인 마진
  const useRate   = deliverTot > 0 ? (deliver/deliverTot)*100 : 0;
  const total     = b2bNet + onNet;
  // ★ 온라인 판매가 마진율은 입력이 아니라 결과값
  const upResult  = ((1 + s.campMargin/100)/(1 - s.uOpFee/100) - 1) * 100;

  // C. 손익분기 — 서비스 이용료가 PG만 커버하면 되므로 손익분기 = PG율 그 자체
  const beFee  = s.pg;
  const feeNew = s.uOpFee;   // 서비스 이용료율(거래액 대비)

  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const pct = (n,base) => base>0 ? ((n/base)*100).toFixed(1)+'%' : '-';
  const seg = (val,base,color) => (base>0 && val>0) ? `<div style="width:${Math.min(100,(val/base)*100)}%;background:${color};" class="h-full"></div>` : '';
  const warn = msg => `<p class="text-xs mt-2" style="color:#b91c1c;">⚠️ ${msg}</p>`;
  const note = msg => `<p class="text-xs mt-2" style="color:#b45309;">※ ${msg}</p>`;
  const chip = (color,label,val,base) => `<span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:${color}"></span>${label} ${won(val)} · ${pct(val,base)}</span>`;
  document.getElementById('calc2Result').innerHTML = `
    <section class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-bold text-gray-900 mb-1">📦 납품(B2B) 비즈니스</h3>
      <p class="text-xs text-gray-500 mb-3">캠핑장당 납품금액 × 캠핑장 수 = 납품 총액 → 캠핏 마진율 ${b2bCard ? '− PG' : ''} · 결제 <b>${b2bCard ? '카드·PG' : '계좌이체(PG 없음)'}</b></p>
      <div class="flex h-7 rounded-lg overflow-hidden border border-gray-200">
        ${seg(b2bCost,deliverTot,'#9ca3af')}${seg(b2bPg,deliverTot,'#f472b6')}${seg(b2bNet,deliverTot,'#7c3aed')}
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs text-gray-700">
        ${chip('#9ca3af','원가·기타',b2bCost,deliverTot)}
        ${b2bCard ? chip('#f472b6','B2B PG',b2bPg,deliverTot) : ''}
        ${chip('#7c3aed','캠핏 납품 마진',b2bNet,deliverTot)}
      </div>
      ${b2bNet < 0 ? warn('납품 마진율이 PG 수수료율보다 낮아 납품 마진이 <b>마이너스</b>입니다.') : ''}
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
        <div class="rounded-xl p-4" style="background:#f3e8ff;">
          <div class="text-xs text-purple-700 font-semibold">캠핏 납품 마진 (월)</div>
          <div class="text-2xl font-bold text-purple-900 mt-1">${won(b2bNet)}</div>
          <div class="text-xs text-purple-700 mt-1">납품 총액 대비 ${pct(b2bNet,deliverTot)} · 연 ${won(b2bNet*12)}</div>
        </div>
        <div class="rounded-xl p-4" style="background:#f3f4f6;">
          <div class="text-xs text-gray-600 font-semibold">납품 총액 (월)</div>
          <div class="text-2xl font-bold text-gray-800 mt-1">${won(deliverTot)}</div>
          <div class="text-xs text-gray-500 mt-1">${won(s.deliverPerCamp)}/곳 × ${fmt(s.camps)}곳</div>
        </div>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-bold text-gray-900 mb-1">🛒 오더앤픽 온라인 정산 <span class="text-xs font-normal" style="color:#dc2626;">RS 폐지</span></h3>
      <p class="text-xs text-gray-500 mb-1">거래액 ${won(GMV)} (연 ${won(GMV*12)}) — 캠퍼 ${won(s.avgSpend)} × 예약 ${fmt(s.resv)}건 × ${fmt(s.camps)}곳 × 이용률 ${s.adopt}%</p>
      <p class="text-xs mb-3" style="color:#1d4ed8;">거래액에서 <b>서비스 이용료 ${s.uOpFee}%</b>를 공제하고, 나머지 <b>${won(settleTot)}</b>이 캠핑장 정산액(구입원가 회수 + 마진)입니다.</p>
      <div class="flex h-7 rounded-lg overflow-hidden border border-gray-200">
        ${seg(deliver,GMV,'#9ca3af')}${seg(campAmt,GMV,'#fb923c')}${seg(onPg,GMV,'#f472b6')}${seg(onNet,GMV,'#2563eb')}
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs text-gray-700">
        ${chip('#9ca3af','납품가(캠핑장 회수)',deliver,GMV)}
        ${chip('#fb923c','캠핑장 마진',campAmt,GMV)}

// ===== 🏷 SKU 경쟁력 시뮬레이터 =====
// 시트 「초기 SKU(연동용)」 60종에 요율을 적용해 씨스페이스·하나로마트 대비 경쟁력을 본다.
//   납품가      = 공급가 × (1+납품가율)         → 씨스페이스(편의점 납품가)와 대조
//   판매가      = 납품가 × (1+업률), 10원 처리   → 하나로마트(소매가)와 대조
//   캠핑장 마진 = 판매가 × (1−이용료율) − 납품가
const skuCmpState = { b2bRate: 10, upRate: 15, opFee: 8, round: 2, cat: 'all', only: 'all', sort: 'cat' };
let skuCmpData = null, skuCmpError = null, skuCmpLoading = false;

function loadSkuCompare() {
  if (skuCmpLoading || skuCmpData) return;
  if (!SKUCMP_URL || SKUCMP_URL.indexOf('YOUR_') === 0) { skuCmpError = 'NOURL'; return; }
  skuCmpLoading = true;
  fetch(SKUCMP_URL)
    .then(r => r.json())
    .then(d => { if (d.error) throw new Error(d.error); skuCmpData = d; skuCmpError = null; })
    .catch(e => { skuCmpError = e.message || String(e); })
    .then(() => { skuCmpLoading = false; if (currentSection === 'skucompare') render(); });
}

// 현재 요율을 60종에 적용한 결과
function skuCmpRows() {
  const s = skuCmpState, b = s.b2bRate/100, u = s.upRate/100, f = s.opFee/100;
  return ((skuCmpData && skuCmpData.skus) || []).map(x => {
    const deliv  = x.supply * (1 + b);
    const price  = r10(deliv * (1 + u), s.round);
    return Object.assign({}, x, {
      deliv, price,
      margin  : price * (1 - f) - deliv,
      csDiff  : x.cspace == null ? null : deliv - x.cspace,
      csPct   : x.cspace == null ? null : (deliv / x.cspace - 1) * 100,
      hnDiff  : x.hanaro == null ? null : price - x.hanaro,
      hnPct   : x.hanaro == null ? null : (price / x.hanaro - 1) * 100,
      // 여유 업률 = 이만큼 얹어도 씨스페이스보다 싸다
      headroom: x.cspace == null ? null : (x.cspace / x.supply - 1) * 100
    });
  });
}

function renderSkuCompare() {
  loadSkuCompare();
  const s = skuCmpState;
  const inp = (id, label, val, step, hint) =>
    `<div>
       <label class="block text-xs text-gray-500 mb-1">${label}</label>
       <div class="relative">
         <input id="${id}" type="number" step="${step}" value="${val}" class="w-full border border-gray-300 rounded-lg pl-3 pr-8 py-2 text-sm" />
         <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 pointer-events-none">%</span>
       </div>
       <p class="text-[11px] text-gray-400 mt-1">${hint}</p>
     </div>`;
  const sel = (id, label, val, opts) =>
    `<div>
       <label class="block text-xs text-gray-500 mb-1">${label}</label>
       <select id="${id}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
         ${opts.map(o => `<option value="${o[0]}" ${val === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
       </select>
     </div>`;

  const brk  = s.opFee >= 100 ? null : s.opFee / (100 - s.opFee) * 100;   // 마진 0이 되는 업률
  const cats = ['all'].concat(Array.from(new Set(((skuCmpData && skuCmpData.skus) || []).map(x => x.category))));

  return `
    <h1 class="text-2xl font-bold text-gray-900 mb-1">🏷 SKU 경쟁력 시뮬레이터</h1>
    <p class="text-sm text-gray-500 mb-4">초도 <b>60종 실데이터</b>에 요율을 적용해, <b>씨스페이스(편의점 납품가)</b>·<b>하나로마트(소매가)</b> 대비 경쟁력이 어떻게 변하는지 봅니다.</p>
    <p class="text-xs text-gray-500 mb-4 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
      💡 <b>모든 금액 VAT 포함</b> · 데이터는 구글시트 <b>「초기 SKU(연동용)」</b>에서 읽어옵니다 — 시트를 고치고 새로고침하면 그대로 반영됩니다.
    </p>

    <section class="bg-white rounded-xl shadow-sm p-5 mb-4" style="border:2px solid #0f766e;">
      <h3 class="font-bold text-gray-900 mb-3">📥 요율</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        ${inp('scB2b','캠핏 납품 마진율', s.b2bRate, 0.5, '공급가 → 캠핑장 납품가')}
        ${inp('scUp','판매가 업률', s.upRate, 0.5, brk == null ? '납품가 → 온라인 판매가' : `납품가 → 판매가 · <b style="color:${s.upRate < brk ? '#dc2626' : '#0f766e'}">손익분기 ${brk.toFixed(2)}%</b>`)}
        ${inp('scFee','서비스 이용료율', s.opFee, 0.5, '판매가에서 공제 → 캠핑장 정산가')}
        ${sel('scRound','판매가 10원 처리', String(s.round), [['2','올림'],['1','반올림'],['0','미적용']])}
      </div>
      <p class="text-xs mt-2" style="color:#0f766e;">
        ※ <b>업률을 올려도 씨스페이스 대조는 그대로</b>입니다 — 씨스는 납품가 기준이고 업률은 그 뒤에 붙기 때문입니다.
        반대로 <b>납품가율은 양쪽 다</b> 움직입니다(판매가가 납품가에서 파생). <b>이용료율</b>은 캠핑장 마진에만 영향을 줍니다.
      </p>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-4 pt-4 border-t border-gray-100">
        ${sel('scCat','카테고리', s.cat, cats.map(c => [c, c === 'all' ? '전체' : c]))}
        ${sel('scOnly','보기', s.only, [['all','전체'],['cs','씨스페이스 열위만'],['hn','하나로마트 열위만'],['neg','캠핑장 마진 적자만']])}
        ${sel('scSort','정렬', s.sort, [['cat','카테고리순'],['cs','씨스 열위 큰 순'],['hn','하나로 열위 큰 순'],['margin','마진 낮은 순']])}
      </div>
    </section>

    <div id="skuCmpBody"></div>
  `;
}

function attachSkuCompareHandlers() {
  const map = { scB2b:'b2bRate', scUp:'upRate', scFee:'opFee' };
  const sync = (redrawHeader) => {
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) skuCmpState[map[id]] = parseNum(el.value);
    });
    ['scRound','scCat','scOnly','scSort'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === 'scRound') skuCmpState.round = parseInt(el.value, 10);
      else skuCmpState[{scCat:'cat', scOnly:'only', scSort:'sort'}[id]] = el.value;
    });
    if (redrawHeader) { render(); return; }   // 손익분기 안내가 바뀌므로 헤더까지 다시 그림
    updateSkuCompare();
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => sync(id === 'scFee'));
  });
  ['scRound','scCat','scOnly','scSort'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => sync(false));
  });
  updateSkuCompare();
}

function updateSkuCompare() {
  const box = document.getElementById('skuCmpBody');
  if (!box) return;
  const s = skuCmpState;

  // ── 데이터가 아직 없을 때
  if (!skuCmpData) {
    if (skuCmpError === 'NOURL') {
      box.innerHTML = `<section class="bg-amber-50 border border-amber-200 rounded-xl p-6">
        <h3 class="font-bold text-amber-900 mb-2">⚙️ 연동 설정이 필요합니다</h3>
        <p class="text-sm text-amber-800 mb-3"><code>apps-script-skucompare.gs</code>를 새 Apps Script 프로젝트로 배포한 뒤, 받은 URL을 <code>index.html</code>의 <b>SKUCMP_URL</b>에 넣어주세요.</p>
        <p class="text-xs text-amber-700">기존 <code>APPS_SCRIPT_URL</code>은 건드리지 마세요 — 다른 7개 탭이 물려 있습니다.</p>
      </section>`;
    } else if (skuCmpError) {
      box.innerHTML = `<section class="bg-red-50 border border-red-200 rounded-xl p-6">
        <h3 class="font-bold text-red-900 mb-2">❌ 데이터를 불러오지 못했습니다</h3>
        <p class="text-sm text-red-800 font-mono">${skuCmpError}</p>
        <p class="text-xs text-red-700 mt-2">Apps Script 배포 시 <b>액세스 권한 = "모든 사용자"</b>인지, 탭 이름이 <b>초기 SKU(연동용)</b>인지 확인해 주세요.</p>
      </section>`;
    } else {
      box.innerHTML = `<section class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-400 text-sm">시트에서 60종을 읽어오는 중…</section>`;
    }
    return;
  }

  const all = skuCmpRows();
  const won = n => (n == null ? '—' : fmtNum(Math.round(n)));
  const pct = n => (n == null ? '—' : (n > 0 ? '+' : '') + n.toFixed(1) + '%');
  // 우위(음수)=초록 / 열위(양수)=빨강 / 비교불가=회색
  const tone = d => d == null ? 'color:#9ca3af' : (d <= 0 ? 'color:#059669;font-weight:600' : 'color:#dc2626;font-weight:600');

  // ── 상단 지표 (필터와 무관하게 60종 전체 기준)
  const cs  = all.filter(r => r.csDiff != null), csW = cs.filter(r => r.csDiff <= 0).length;
  const hn  = all.filter(r => r.hnDiff != null), hnW = hn.filter(r => r.hnDiff <= 0).length;
  const neg = all.filter(r => r.margin < 0).length;
  const avgM = all.length ? all.reduce((a, r) => a + r.margin, 0) / all.length : 0;
  const brk  = s.opFee >= 100 ? null : s.opFee / (100 - s.opFee) * 100;

  const card = (label, main, sub, color) =>
    `<div class="bg-white rounded-xl shadow-sm p-5 border-t-4" style="border-color:${color}">
       <div class="text-xs text-gray-500">${label}</div>
       <div class="text-2xl font-extrabold mt-1" style="color:${color}">${main}</div>
       <div class="text-xs text-gray-400 mt-1">${sub}</div>
     </div>`;

  // ── 열 그룹 배경색 (헤더는 진하게 / 본문은 옅게)
  const G = {
    base:   { h:'#f1f5f9', b:'#f8fafc' },   // 기본 · 우리 원가
    cspace: { h:'#ccfbf1', b:'#f0fdfa' },   // 씨스페이스 대조
    hanaro: { h:'#dbeafe', b:'#eff6ff' },   // 하나로마트 대조
    margin: { h:'#fef3c7', b:'#fffbeb' }    // 캠핑장 마진
  };

  // ── 상세 표 (필터·정렬 적용)
  let rows = all;
  if (s.cat !== 'all') rows = rows.filter(r => r.category === s.cat);
  if (s.only === 'cs')  rows = rows.filter(r => r.csDiff != null && r.csDiff > 0);
  if (s.only === 'hn')  rows = rows.filter(r => r.hnDiff != null && r.hnDiff > 0);
  if (s.only === 'neg') rows = rows.filter(r => r.margin < 0);
  const S = { cs:(a,b)=>(b.csPct==null?-1e9:b.csPct)-(a.csPct==null?-1e9:a.csPct),
              hn:(a,b)=>(b.hnPct==null?-1e9:b.hnPct)-(a.hnPct==null?-1e9:a.hnPct),
              margin:(a,b)=>a.margin-b.margin,
              cat:(a,b)=>a.category.localeCompare(b.category,'ko')||a.name.localeCompare(b.name,'ko') };
  rows = rows.slice().sort(S[s.sort] || S.cat);

  const warn = (skuCmpData.warnings || []).length
    ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-xs text-amber-800">
         ⚠️ 시트에서 <b>${skuCmpData.warnings.length}개 행</b>을 건너뛰었습니다 —
         ${skuCmpData.warnings.map(w => `${w.row}행 ${w.name}(${w.reason})`).join(' · ')}
       </div>` : '';

  box.innerHTML = `
    ${warn}
    ${s.opFee < 100 && s.upRate < brk ? `<div class="bg-red-50 border border-red-200 rounded-xl p-3 mb-4 text-sm text-red-800">
      🚨 <b>업률 ${s.upRate}% &lt; 손익분기 ${brk.toFixed(2)}%</b> — 이용료 ${s.opFee}%를 떼고 나면 캠핑장이 남는 게 없습니다. 업률을 올리거나 이용료를 낮춰야 합니다.
    </div>` : ''}

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      ${card('씨스페이스 대비 우위 <span class="text-gray-400">(납품가 기준)</span>',
             `${csW} / ${cs.length}`,
             `${all.length - cs.length}종 비교불가 · 캠지기가 편의점보다 싸게 받는 품목`, '#0f766e')}
      ${card('하나로마트 대비 우위 <span class="text-gray-400">(판매가 기준)</span>',
             `${hnW} / ${hn.length}`,
             `${all.length - hn.length}종 비교불가 · 캠퍼가 마트보다 싸게 사는 품목`, '#1d4ed8')}
      ${card('캠핑장 마진 <span class="text-gray-400">(이용료 ' + s.opFee + '% 공제 후)</span>',
             `평균 ${won(avgM)}원`,
             neg ? `🚨 적자 ${neg}종` : '적자 0종', neg ? '#dc2626' : '#b45309')}
    </div>

    <section class="bg-white rounded-xl shadow-sm p-5">
      <h3 class="font-bold text-gray-900 mb-1">📋 품목별 <span class="text-sm font-normal text-gray-400">${rows.length}종</span></h3>
      <p class="text-xs text-gray-500 mb-3">차이가 <b style="color:#059669">음수(초록)</b>면 우리가 저렴 = 우위. <b style="color:#dc2626">양수(빨강)</b>면 열위. <span style="color:#9ca3af">—</span>는 상대 가격 미확보.</p>
      <div class="overflow-x-auto">
      <table class="w-full text-sm whitespace-nowrap border-separate" style="border-spacing:0">
        <thead>
          <tr class="text-[11px] font-semibold text-gray-600">
            <th colspan="4" class="text-left px-3 py-1.5 rounded-t" style="background:${G.base.h}">기본 · 우리 원가</th>
            <th colspan="2" class="text-center px-3 py-1.5 rounded-t" style="background:${G.cspace.h};color:#0f766e">씨스페이스 대조 <span class="font-normal">(납품가 기준)</span></th>
            <th colspan="3" class="text-center px-3 py-1.5 rounded-t" style="background:${G.hanaro.h};color:#1d4ed8">하나로마트 대조 <span class="font-normal">(판매가 기준)</span></th>
            <th class="text-center px-3 py-1.5 rounded-t" style="background:${G.margin.h};color:#b45309">결과</th>
            <th></th>
          </tr>
          <tr class="text-xs text-gray-500">
            <th class="text-left px-3 py-2 sticky left-0" style="background:${G.base.h}">상품명</th>
            <th class="text-left px-2 py-2" style="background:${G.base.h}">규격</th>
            <th class="text-right px-2 py-2" style="background:${G.base.h}">공급가</th>
            <th class="text-right px-3 py-2" style="background:${G.base.h}">납품가</th>
            <th class="text-right px-2 py-2" style="background:${G.cspace.h}">씨스페이스</th>
            <th class="text-right px-3 py-2" style="background:${G.cspace.h}">차이</th>
            <th class="text-right px-3 py-2" style="background:${G.hanaro.h}">판매가</th>
            <th class="text-right px-2 py-2" style="background:${G.hanaro.h}">하나로마트</th>
            <th class="text-right px-3 py-2" style="background:${G.hanaro.h}">차이</th>
            <th class="text-right px-3 py-2" style="background:${G.margin.h}">캠핑장 마진</th>
            <th class="text-left px-3 py-2">공급사</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length === 0 ? '<tr><td colspan="11" class="py-6 text-center text-gray-400">해당하는 품목이 없습니다</td></tr>' :
            rows.map(r => `<tr>
            <td class="px-3 py-2 font-medium sticky left-0 border-b border-white" style="background:${G.base.b}">${r.name}</td>
            <td class="px-2 py-2 text-gray-400 text-xs border-b border-white" style="background:${G.base.b}">${r.spec || ''}</td>
            <td class="px-2 py-2 text-right tabular-nums text-gray-500 border-b border-white" style="background:${G.base.b}">${won(r.supply)}</td>
            <td class="px-3 py-2 text-right tabular-nums font-semibold border-b border-white" style="background:${G.base.b}">${won(r.deliv)}</td>
            <td class="px-2 py-2 text-right tabular-nums text-gray-500 border-b border-white" style="background:${G.cspace.b}">${won(r.cspace)}</td>
            <td class="px-3 py-2 text-right tabular-nums border-b border-white" style="background:${G.cspace.b};${tone(r.csDiff)}">${r.csDiff == null ? '—' : `${r.csDiff > 0 ? '+' : ''}${won(r.csDiff)} <span class="text-[11px] opacity-70">${pct(r.csPct)}</span>`}</td>
            <td class="px-3 py-2 text-right tabular-nums font-semibold border-b border-white" style="background:${G.hanaro.b}">${won(r.price)}</td>
            <td class="px-2 py-2 text-right tabular-nums text-gray-500 border-b border-white" style="background:${G.hanaro.b}">${won(r.hanaro)}</td>
            <td class="px-3 py-2 text-right tabular-nums border-b border-white" style="background:${G.hanaro.b};${tone(r.hnDiff)}">${r.hnDiff == null ? '—' : `${r.hnDiff > 0 ? '+' : ''}${won(r.hnDiff)} <span class="text-[11px] opacity-70">${pct(r.hnPct)}</span>`}</td>
            <td class="px-3 py-2 text-right tabular-nums border-b border-white" style="background:${G.margin.b};color:${r.margin < 0 ? '#dc2626' : '#b45309'};font-weight:600">${won(r.margin)}</td>
            <td class="px-3 py-2 text-gray-400 text-xs border-b border-gray-100">${r.vendor || ''}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>
      <p class="text-xs text-gray-400 mt-3">데이터 ${skuCmpData.count}종 · 시트 「${skuCmpData.sheetName}」 · 갱신 ${new Date(skuCmpData.generatedAt).toLocaleString('ko-KR')}</p>
    </section>
  `;
}

// ===== 네비 이벤트 =====
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentSection = item.dataset.section;
    render();
  });
});

loadData();
</script>
</body>
</html>
