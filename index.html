<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오더앤픽 SKU 가격 보고서</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { font-family: 'Pretendard', sans-serif; }
  body { background: #f5f4ef; }
  .tier-B { background: #c8e6c9; color: #1b5e20; }   /* 소형 (베이스) */
  .tier-A { background: #fff9c4; color: #827717; }   /* 중형 */
  .tier-S { background: #ffccbc; color: #bf360c; }   /* 대형 (프리미엄) */
  .badge { display:inline-flex; align-items:center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .nav-item { display:flex; align-items:center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 14px; color: #555; cursor: pointer; transition: background .15s; }
  .nav-item:hover { background: #efece4; }
  .nav-item.active { background: #1f6d4a; color: white; font-weight: 600; }
  .nav-item .num { margin-left: auto; font-size: 11px; opacity: .7; }
  /* 네비 그룹 라벨 */
  .nav-group { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 0 14px 6px; margin-top: 18px; display: flex; align-items: center; gap: 6px; }
  .nav-group:first-child { margin-top: 0; }
  .nav-group .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .nav-group.on  { color: #1f6d4a; }
  .nav-group.off { color: #9ca3af; }
  /* 사용 불가 — 클릭은 되지만 데이터가 낡았음을 흐리게 표시 */
  .nav-item.muted { color: #a1a1aa; }
  .nav-item.muted:hover { background: #f4f4f5; }
  .nav-item.muted .num { color: #a1a1aa; }
  .nav-item.muted.active { background: #9ca3af; color: #fff; }
  .price-bar { height: 6px; border-radius: 3px; transition: width .3s ease; }
  .sku-card { transition: transform .15s ease, box-shadow .15s ease; }
  .sku-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  table.compare { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.compare th, table.compare td { padding: 8px 10px; border-bottom: 1px solid #e5e5e0; text-align: right; white-space: nowrap; }
  table.compare th { background: #f0ede5; font-weight: 600; color: #444; position: sticky; top: 0; z-index: 5; }
  table.compare th.text-left, table.compare td.text-left { text-align: left; }
  table.compare tr:hover td { background: #fafaf6; }
  .tag-good { color: #1565c0; font-weight: 600; }
  .tag-bad { color: #c62828; font-weight: 600; }
  .tag-neutral { color: #757575; }
  .core-star { color: #e53935; font-weight: bold; margin-right: 4px; font-size: 14px; }
  /* 로딩 오버레이 */
  #loadingOverlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  .loader-spinner {
    width: 56px; height: 56px;
    border: 5px solid #e5e7eb;
    border-top-color: #1f6d4a;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-title { font-size: 18px; font-weight: 700; color: #1f6d4a; margin-top: 20px; }
  .loader-sub { font-size: 13px; color: #6b7280; margin-top: 6px; }
  .loader-progress {
    margin-top: 16px;
    width: 240px; height: 4px;
    background: #e5e7eb; border-radius: 2px; overflow: hidden;
  }
  .loader-bar {
    height: 100%;
    background: #1f6d4a;
    animation: progress 1.4s ease-in-out infinite;
  }
  @keyframes progress {
    0% { width: 0%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }
  /* 비교 컬럼 그룹 색상 */
  .grp-camp, .grp-camp th { background: #e3f2fd !important; }      /* 파랑 — 캠지기 납품 */
  .grp-online, .grp-online th { background: #fff3e0 !important; }  /* 주황 — 온라인 */
  .grp-offline, .grp-offline th { background: #fce4ec !important; }/* 분홍 — 오프라인 */
  table.compare tr:hover td.grp-camp { background: #d6e9fa !important; }
  table.compare tr:hover td.grp-online { background: #ffe7c4 !important; }
  table.compare tr:hover td.grp-offline { background: #fbcfdc !important; }
  /* 클릭 가능 행 */
  table.compare tbody tr { cursor: pointer; }
  /* 모달 */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: white; border-radius: 16px; max-width: 720px; width: 100%;
    max-height: 90vh; overflow-y: auto; padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-close {
    position: absolute; top: 16px; right: 20px; font-size: 28px;
    color: #999; cursor: pointer; background: none; border: none;
  }
  .modal-close:hover { color: #333; }
</style>
</head>
<body class="min-h-screen">

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz755tugzi8pou1g92uk5z-if3kcAZLSLx6EIi8gsjqcSE-jQiWJkrxI0F91ZUlCC7IJw/exec';

  // SKU 경쟁력 시뮬레이터 전용 API — 시트 「초기 SKU(연동용)」
  // ★ 위 APPS_SCRIPT_URL과 별개. apps-script-skucompare.gs 를 새 프로젝트로 배포한 뒤 그 URL을 넣는다.
  const SKUCMP_URL = 'https://script.google.com/macros/s/AKfycbzTH-3hw4mlLAaGy_4BSpK6qNO80DHq6c4zhqV2NQI9YMC-Z4GrGtalWcdXJv9YUDoIoA/exec';
</script>

<!-- 헤더 -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
  <div class="px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="text-xl font-bold text-emerald-800">오더앤픽</div>
      <div class="text-sm text-gray-500">SKU 가격 보고서</div>
    </div>
    <div class="text-xs text-gray-500" id="updatedAt">데이터 로드 중...</div>
  </div>
</header>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
  <div class="loader-spinner"></div>
  <div class="loader-title">데이터를 불러오는 중입니다</div>
  <div class="loader-sub">구글 스프레드시트에서 SKU 데이터를 가져오고 있어요 (보통 2~5초)</div>
  <div class="loader-progress"><div class="loader-bar"></div></div>
</div>

<!-- 상품 상세 모달 -->
<div id="skuModal" class="hidden"></div>

<div class="flex">
  <!-- 사이드바 -->
  <aside class="w-64 min-h-[calc(100vh-57px)] bg-white border-r border-gray-200 p-4 sticky top-[57px]">
    <nav class="space-y-1">
      <div class="nav-group on"><span class="dot" style="background:#1f6d4a"></span>사용 가능</div>
      <div class="nav-item active" data-section="camfitcalc3">
        <span class="text-lg">🎯</span><span>캠핏 마진 계산기 (선 판매가 산정)</span>
      </div>
      <div class="nav-item" data-section="skucompare">
        <span class="text-lg">🏷</span><span>SKU 경쟁력 시뮬레이터</span>
      </div>

      <div class="nav-group off"><span class="dot" style="background:#d4d4d8"></span>사용 불가</div>
      <div class="nav-item muted" data-section="camfitcalc2">
        <span class="text-lg">🧾</span><span>캠핏 마진 계산기 (서비스 이용료)</span>
      </div>
      <div class="nav-item muted" data-section="camfitcalc">
        <span class="text-lg">🧮</span><span>캠핏 마진 계산기 (RS버전)</span>
      </div>
      <div class="nav-item muted" data-section="dashboard">
        <span class="text-lg">📊</span><span>대시보드</span>
      </div>
      <div class="nav-item muted" data-section="table">
        <span class="text-lg">📋</span><span>전체 가격 비교</span>
      </div>
      <div class="nav-item muted" data-section="supply">
        <span class="text-lg">📦</span><span>캠핑장 납품 분석</span>
      </div>
      <div class="nav-item muted" data-section="online">
        <span class="text-lg">🛒</span><span>온라인 판매가 분석</span>
      </div>
      <div class="nav-item muted" data-section="offline">
        <span class="text-lg">🏪</span><span>오프라인 판매가 분석</span>
      </div>
      <div class="nav-item muted" data-section="sizes">
        <span class="text-lg">🏕</span><span>캠핑장 사이즈별 SKU</span>

      <div class="nav-item muted" data-section="simulation">

      </div>

  </aside>

  <!-- 메인 -->
  <main class="flex-1 p-6 max-w-[1600px]">
    <div id="sectionContainer"></div>

</div>

<script>
let allSkus = [];
let allCounts = {};
let allMargins = {};
let allMarginLabels = {};
let allVendors = [];
let currentSection = 'camfitcalc3';
let currentTier = 'S';   // 기본 = 대형(전체)

const categoryEmoji = {
  '라면': '🍜', '즉석밥': '🍚', '즉석식품': '🥫', '제과': '🍪',
  '소스류': '🧂', '음료': '🥤', '안주류': '🍻', '기타': '🔥'
};

const SECTION_LABELS = {
  dashboard: '대시보드',
  table: '전체 가격 비교',
  supply: '캠핑장 납품 분석',
  online: '온라인 판매가 분석',
  offline: '오프라인 판매가 분석',
  sizes: '캠핑장 사이즈별 SKU',
  simulation: '시뮬레이션',
  camfitcalc: '캠핏 마진 계산기 (RS버전)',
  camfitcalc2: '캠핏 마진 계산기 (서비스 이용료)',
  camfitcalc3: '캠핏 마진 계산기 (선 판매가 산정)'
};

window.showImgFail = function(container, emoji) {
  container.innerHTML = `<div class="text-4xl">${emoji}</div><div class="text-xs mt-1">이미지 없음</div>`;
};

function fmt(n) {
  if (n == null || n === '') return '-';
  return Math.round(n).toLocaleString('ko-KR');
}
function fmtWon(n) { return n == null ? '-' : fmt(n) + '원'; }
function fmtPct(n, digits=1) {
  if (typeof n !== 'number') return '-';
  return (n*100).toFixed(digits) + '%';
}

// 비교 결과 (정액원 + %)
function compareLabel(myValue, theirValue, myLabel, theirLabel) {
  if (myValue == null || theirValue == null || theirValue === 0) {
    return { html: `<span class="tag-neutral">비교불가</span>`, raw: null };
  }
  const diffWon = Math.round(myValue - theirValue);
  const pct = ((myValue - theirValue) / theirValue);
  const absWon = Math.abs(diffWon).toLocaleString('ko-KR');
  const absPct = Math.abs(pct*100).toFixed(1);
  if (diffWon === 0) {
    return { html: `<span class="tag-neutral">${theirLabel} 대비 동일</span>`, raw: 0 };
  }
  if (diffWon > 0) {
    return {
      html: `<span class="tag-bad">${theirLabel} 대비 ${absWon}원 비쌈 (${absPct}%)</span>`,
      raw: pct
    };
  }
  return {
    html: `<span class="tag-good">${theirLabel} 대비 ${absWon}원 저렴 (${absPct}%)</span>`,
    raw: pct
  };
}

function hideLoading() {
  const ov = document.getElementById('loadingOverlay');
  if (ov) {
    ov.classList.add('hidden');
    setTimeout(() => ov.style.display = 'none', 500);
  }
}

// allSkus(견적체크 시트)가 필요 없는 섹션 — 계산기 3종은 입력만으로, SKU 경쟁력은 자체 API로 돈다
function isStandaloneSection(sec) {
  return sec.startsWith('camfitcalc') || sec === 'skucompare';
}

async function loadData() {
  // 이 섹션들은 시트 데이터가 필요 없으므로 먼저 그리고 로딩도 걷는다 (로드 실패·지연에도 즉시 사용 가능)
  if (isStandaloneSection(currentSection)) { render(); hideLoading(); }
  if (APPS_SCRIPT_URL.startsWith('YOUR_')) {
    document.getElementById('sectionContainer').innerHTML = '<div class="bg-amber-50 p-6 rounded-xl">⚠️ Apps Script URL 미설정</div>';
    hideLoading();
    return;
  }
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    allSkus = data.skus || [];
    allCounts = data.counts || {};
    allMargins = data.margins || {};
    allMarginLabels = data.marginLabels || {
      vendorDiscount: '벤더 할인율',
      camfit: '캠핏 마진',
      camp: '캠핑장 마진',
      offline: '오프라인 추가'
    };
    allVendors = data.vendors || [];
    document.getElementById('updatedAt').textContent =
      `갱신: ${new Date(data.generatedAt).toLocaleString('ko-KR')}`;
    if (!isStandaloneSection(currentSection)) render();   // 계산기·SKU경쟁력은 이미 그려져 있음 (입력값 유지)
    hideLoading();
  } catch (e) {
    document.getElementById('updatedAt').textContent = `❌ 로드 실패: ${e.message}`;
    hideLoading();
  }
}

function render() {
  const map = {
    dashboard: renderDashboard,
    table: renderTable,
    supply: renderSupplyAnalysis,
    online: renderOnlineAnalysis,
    offline: renderOfflineAnalysis,
    sizes: renderSizes,
    simulation: renderSimulation,
    camfitcalc: renderCamfitCalc,
    camfitcalc2: renderCamfitCalc2,
    camfitcalc3: renderCamfitCalc3,
    skucompare: renderSkuCompare
  };
  const fn = map[currentSection] || renderDashboard;
  document.getElementById('sectionContainer').innerHTML = fn();
  if (currentSection === 'dashboard') drawDashboardCharts();
  if (currentSection === 'table') attachTableHandlers();
  if (currentSection === 'supply') drawSupplyChart();
  if (currentSection === 'online') drawOnlineChart();
  if (currentSection === 'offline') drawOfflineChart();
  if (currentSection === 'sizes') attachSizesHandlers();
  if (currentSection === 'simulation') attachSimulationHandlers();
  if (currentSection === 'camfitcalc') attachCamfitCalcHandlers();
  if (currentSection === 'camfitcalc2') attachCamfitCalc2Handlers();
  if (currentSection === 'camfitcalc3') attachCamfitCalc3Handlers();
  if (currentSection === 'skucompare') attachSkuCompareHandlers();
}

// ===== 1. 대시보드 =====
function renderDashboard() {
  const total = allSkus.length;
  const received = allSkus.filter(s=>s.quoteStatus==='수령').length;

  // 카테고리별 × 티어별 매트릭스
  const categories = [...new Set(allSkus.map(s => s.category))];
  const tierOrder = ['B','A','S'];
  const matrix = {};
  categories.forEach(c => {
    matrix[c] = { B:0, A:0, S:0 };
    allSkus.filter(s => s.category === c).forEach(s => {
      if (matrix[c][s.tier] !== undefined) matrix[c][s.tier]++;
    });
  });

  // 누적 카운트 (각 캠핑장 사이즈에 실제 들어가는 SKU 수) - 대형부터 표시
  const tableRows = categories.map(c => {
    const r = matrix[c];
    const bCount = r.B;
    const aCount = r.B + r.A;
    const sCount = r.B + r.A + r.S;
    return `<tr>
      <td class="text-left font-medium">${categoryEmoji[c]||''} ${c}</td>
      <td class="font-bold">${sCount}</td>
      <td>${aCount}</td>
      <td>${bCount}</td>
    </tr>`;
  }).join('');
  const totalsCum = { B: 0, A: 0, S: 0 };
  categories.forEach(c => {
    totalsCum.B += matrix[c].B;
    totalsCum.A += (matrix[c].B + matrix[c].A);
    totalsCum.S += (matrix[c].B + matrix[c].A + matrix[c].S);
  });

  const totalVendors = allVendors.length;
  const respondedVendors = allVendors.filter(v => v.status === 'O').length;

  return `
    <h1 class="text-2xl font-bold text-gray-900 mb-1">대시보드</h1>
    <p class="text-sm text-gray-500 mb-6">오더앤픽 SKU 한 눈에 보기</p>

    ${renderVendorPanel()}

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 mb-6">
      ${kpiCard('초기 사입 SKU', total + '종', 'emerald')}
      ${kpiCard('견적 수령률', total ? Math.round(received/total*100)+'%' : '-', 'blue', `${received}/${total}`)}
      ${kpiCard('참여 벤더사', totalVendors + '곳', 'amber', `회신 ${respondedVendors}곳`)}
      ${kpiCard('진행 요청 캠핑장', (allCounts.requestedCamps != null ? allCounts.requestedCamps : '-') + '곳', 'sky', '오더앤픽 신청 완료')}
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4">
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <h3 class="font-bold text-gray-900 mb-1">캠핑장별 카테고리 SKU</h3>
        <p class="text-xs text-gray-500 mb-3">각 캠핑장 사이즈에 들어가는 SKU 수</p>
        <table class="compare">
          <thead><tr>
            <th class="text-left" style="width:130px;">카테고리</th>
            <th>S (대형)</th>
            <th>A (중형)</th>
            <th>B (소형)</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
          <tfoot>
            <tr class="font-bold bg-gray-50">
              <td class="text-left">합계</td>
              <td>${totalsCum.S}</td>
              <td>${totalsCum.A}</td>
              <td>${totalsCum.B}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm">
        <h3 class="font-bold text-gray-900 mb-1">캠핑장별 SKU 수</h3>
        <p class="text-xs text-gray-500 mb-3">사이즈별 SKU 누적 수</p>
        <canvas id="tierChart"></canvas>
      </div>
    </div>

    <div class="mt-4 bg-white p-5 rounded-xl shadow-sm">
      <h3 class="font-bold text-gray-900 mb-1">카테고리별 SKU 분포</h3>
      <p class="text-xs text-gray-500 mb-3">카테고리별 SKU 수 (티어별 색상)</p>
      <canvas id="categoryChart" style="max-height:380px;"></canvas>
    </div>
  `;
}

// ===== 참여업체 패널 =====
function renderVendorPanel() {
  if (!allVendors || allVendors.length === 0) return '';
  const total = allVendors.length;
  const received = allVendors.filter(v => v.status === 'O').length;
  const pending = total - received;

  const rows = allVendors.map(v => {
    const isDone = v.status === 'O';
    const badge = isDone
      ? '<span class="badge bg-emerald-100 text-emerald-700">✓ 회신 완료</span>'
      : '<span class="badge bg-rose-100 text-rose-700">✗ 미회신</span>';
    const rowBg = isDone ? '' : 'bg-rose-50';
    const noteHtml = v.note ? `<span class="text-gray-700">${v.note}</span>` : '<span class="text-gray-300">-</span>';
    return `<tr class="${rowBg}">
      <td class="text-left font-medium">${v.name}</td>
      <td class="text-left">${v.categories || '-'}</td>
      <td class="text-left text-gray-600">${v.brands || '-'}</td>
      <td>${badge}</td>
      <td class="text-left text-xs">${noteHtml}</td>
    </tr>`;
  }).join('');

  return `
    <div class="mt-4 bg-white p-5 rounded-xl shadow-sm">
      <h3 class="font-bold text-gray-900 mb-1">참여 벤더사 견적 현황</h3>

function kpiCard(label, value, color, sub='') {

function drawDashboardCharts() {
  // 카테고리별 × 티어별 단독 카운트 (스택용)
  const categories = [...new Set(allSkus.map(s => s.category))];
  const matrix = {};
  categories.forEach(c => {
    matrix[c] = { B:0, A:0, S:0 };
    allSkus.filter(s => s.category === c).forEach(s => {
      if (matrix[c][s.tier] !== undefined) matrix[c][s.tier]++;
    });
  });
  // 합계 큰 순으로 정렬
  const sortedCats = [...categories].sort((a,b) => {
    const sa = matrix[a].B + matrix[a].A + matrix[a].S;
    const sb = matrix[b].B + matrix[b].A + matrix[b].S;
    return sb - sa;
  });
  const labels = sortedCats.map(c => `${categoryEmoji[c]||''} ${c}`);

  new Chart(document.getElementById('categoryChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: 'B (소형)', data: sortedCats.map(c => matrix[c].B), backgroundColor: '#66bb6a', borderWidth: 0 },
        { label: 'A (중형 추가)', data: sortedCats.map(c => matrix[c].A), backgroundColor: '#fdd835', borderWidth: 0 },
        { label: 'S (대형 추가)', data: sortedCats.map(c => matrix[c].S), backgroundColor: '#ff7043', borderWidth: 0 }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 12 } } },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.x}종`,
            footer: (items) => {
              const total = items.reduce((sum,i) => sum + i.parsed.x, 0);
              return `합계: ${total}종`;
            }
          }
        }
      },
      scales: {
        x: { stacked: true, beginAtZero: true, ticks: { stepSize: 2 } },
        y: { stacked: true }
      }
    }
  });

  new Chart(document.getElementById('tierChart'), {
    type: 'bar',
    data: {
      labels: ['S (대형 캠핑장)', 'A (중형 캠핑장)', 'B (소형 캠핑장)'],
      datasets: [{ label: '누적 SKU 수', data: [allCounts.S, allCounts.A, allCounts.B], backgroundColor: ['#ff7043','#fdd835','#66bb6a'], borderRadius: 6 }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

// ===== 2. 전체 가격 비교 테이블 =====
let tableFilters = { category: '', tier: '' };

function compareCell(myVal, theirVal) {
  if (myVal == null || theirVal == null || theirVal === 0) return '<span class="text-gray-300">-</span>';
  const diffWon = Math.round(myVal - theirVal);
  if (diffWon === 0) return '<span class="text-gray-500">동일</span>';
  const pct = ((myVal - theirVal) / theirVal) * 100;
  const absWon = Math.abs(diffWon).toLocaleString('ko-KR');
  const absPct = Math.abs(pct).toFixed(1);
  if (diffWon > 0) return `<span class="tag-bad">▲ ${absWon}원 비쌈 (${absPct}%)</span>`;
  return `<span class="tag-good">▼ ${absWon}원 저렴 (${absPct}%)</span>`;
}

function getFilteredTableSkus() {
  return allSkus.filter(s => {
    if (tableFilters.category && s.category !== tableFilters.category) return false;
    if (tableFilters.tier) {
      const t = tableFilters.tier;
      if (t === 'B' && s.tier !== 'B') return false;
      if (t === 'A' && !['B','A'].includes(s.tier)) return false;
      // 'S' = 전체 (필터 없음과 동일)
    }
    return true;
  });
}

function summaryStat(list, key) {
  const nums = list.map(s => s[key]).filter(v => typeof v === 'number');
  if (!nums.length) return { avg: null, cheap: 0, expensive: 0, total: 0 };
  const avg = nums.reduce((a,b)=>a+b,0) / nums.length;
  const cheap = nums.filter(v => v < 0).length;
  const expensive = nums.filter(v => v > 0).length;
  return { avg, cheap, expensive, total: nums.length };
}

function fmtAvgPct(n) {
  if (n == null) return '-';
  return (n > 0 ? '+' : '') + (n*100).toFixed(1) + '%';
}

function renderTableSummary(filtered) {
  const total = filtered.length;
  const supply = summaryStat(filtered, 'vsSysSupply');
  const online = summaryStat(filtered, 'vsCoupang');
  const offline = summaryStat(filtered, 'vsSysMSRP');

  const card = (label, stat, bg, color) => {
    const avgColor = stat.avg == null ? 'text-gray-400' : (stat.avg > 0 ? 'text-rose-600' : 'text-blue-600');
    return `
      <div class="rounded-xl shadow-sm p-4" style="background:${bg};">
        <div class="text-xs text-gray-600 font-medium">${label}</div>
        <div class="text-2xl font-bold mt-1 ${avgColor}">${fmtAvgPct(stat.avg)}</div>
        <div class="text-xs text-gray-500 mt-2">
          비교 ${stat.total}종 · <span class="tag-good">저렴 ${stat.cheap}</span> · <span class="tag-bad">비쌈 ${stat.expensive}</span>
        </div>
      </div>`;
  };

  return `
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
      <div class="bg-white rounded-xl shadow-sm p-4">
        <div class="text-xs text-gray-500">현재 SKU 수 (필터 적용)</div>
        <div class="text-2xl font-bold text-emerald-700 mt-1">${total}종</div>
        <div class="text-xs text-gray-400 mt-2">전체 ${allSkus.length}종 중</div>
      </div>
      ${card('캠핑장 납품가 vs 시스페이스 공급가', supply, '#e3f2fd')}
      ${card('온라인 판매가 vs 쿠팡 판매가', online, '#fff3e0')}
      ${card('오프라인 판매가 vs 시스페이스 권장가', offline, '#fce4ec')}
    </div>
  `;
}

function renderTableRows(filtered) {
  return filtered.map(s => {
    const stat = s.quoteStatus === '미수령' ? '<span class="text-amber-600">미수령</span>' : '<span class="text-emerald-600">수령</span>';
    return `<tr>
      <td class="text-left">${categoryEmoji[s.category]||''} ${s.category}</td>
      <td class="text-left">${s.brand||''}</td>
      <td class="text-left font-medium">${s.core ? '<span class="core-star">★</span>' : ''}${s.name}</td>
      <td>${s.spec||'-'}</td>
      <td>${stat}</td>
      <td>${tierBadgesInline(s.tier)}</td>
      <td>${fmt(s.vendor)}</td>
      <td class="grp-camp">${fmt(s.sysSupply)}</td>
      <td class="font-medium grp-camp">${fmt(s.campSupply)}</td>
      <td class="grp-camp">${compareCell(s.campSupply, s.sysSupply)}</td>
      <td class="grp-online">${fmt(s.coupang)}</td>
      <td class="font-medium grp-online">${fmt(s.online)}</td>
      <td class="grp-online">${compareCell(s.online, s.coupang)}</td>
      <td class="grp-offline">${fmt(s.sysMSRP)}</td>
      <td class="font-medium grp-offline">${fmt(s.offline)}</td>
      <td class="grp-offline">${compareCell(s.offline, s.sysMSRP)}</td>
    </tr>`;
  }).join('');
}

function showSkuModal(s) {
  if (!s) return;
  const emoji = categoryEmoji[s.category] || '📦';
  const containerClass = 'w-full aspect-square bg-gray-50 rounded-lg flex flex-col items-center justify-center text-gray-400 overflow-hidden';
  const imageHtml = s.image && s.image.trim()
    ? `<div class="${containerClass}" style="max-width:260px;">
         <img src="${s.image.replace(/"/g,'&quot;')}" alt=""
              class="max-h-full max-w-full object-contain"
              onerror="window.showImgFail(this.parentElement, ${JSON.stringify(emoji)})" />
       </div>`
    : `<div class="${containerClass}" style="max-width:260px;"><div class="text-5xl">${emoji}</div><div class="text-xs mt-2">이미지 없음</div></div>`;

  const statusBadge = s.quoteStatus === '미수령'
    ? '<span class="badge bg-amber-100 text-amber-800">🟡 견적 미수령</span>'
    : '<span class="badge bg-emerald-100 text-emerald-800">✓ 견적 수령</span>';

  // 절대 차이(원) 계산
  const diffBlock = (myLabel, myVal, theirLabel, theirVal, bg) => {
    if (myVal == null || theirVal == null) {
      return `<div class="rounded-xl p-4" style="background:${bg};">
        <div class="text-xs text-gray-600 font-semibold mb-2">${myLabel} vs ${theirLabel}</div>
        <div class="text-gray-400">비교불가</div>
      </div>`;
    }
    const diffWon = Math.round(myVal - theirVal);
    const pct = ((myVal - theirVal) / theirVal) * 100;
    const absWon = Math.abs(diffWon).toLocaleString('ko-KR');
    const absPct = Math.abs(pct).toFixed(1);
    const isHigher = diffWon > 0;
    const isSame = diffWon === 0;
    const colorClass = isSame ? 'text-gray-500' : (isHigher ? 'text-rose-600' : 'text-blue-600');
    const label = isSame ? '동일' : (isHigher ? '비쌈' : '저렴');
    const sign = isSame ? '' : (isHigher ? '▲' : '▼');
    return `<div class="rounded-xl p-4" style="background:${bg};">
      <div class="text-xs text-gray-600 font-semibold mb-2">${myLabel} vs ${theirLabel}</div>
      <div class="flex items-baseline gap-2 mb-1">
        <span class="text-xs text-gray-500">${myLabel}</span>
        <span class="font-mono font-bold">${fmt(myVal)}원</span>
      </div>
      <div class="flex items-baseline gap-2 mb-2">
        <span class="text-xs text-gray-500">${theirLabel}</span>
        <span class="font-mono">${fmt(theirVal)}원</span>
      </div>
      <div class="pt-2 border-t border-gray-200/70">
        <div class="${colorClass} font-bold text-lg">${sign} ${absWon}원 ${label}</div>
        <div class="${colorClass} text-xs">(${absPct}%)</div>
      </div>
    </div>`;
  };

  const modal = document.getElementById('skuModal');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal-box relative" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="hideSkuModal()">×</button>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>${imageHtml}</div>
        <div>
          <div class="text-xs text-gray-500">${emoji} ${s.category} · ${s.brand||''}</div>
          <div class="text-2xl font-bold text-gray-900 mt-1">${s.core ? '<span class="core-star">★</span>' : ''}${s.name}</div>
          <div class="text-sm text-gray-500 mt-1">${s.spec || ''}</div>
          <div class="mt-3 flex flex-wrap gap-2">${statusBadge} ${tierBadgesInline(s.tier)}</div>
          <div class="mt-4 grid grid-cols-2 gap-2 text-xs">
            <div class="bg-gray-50 rounded p-2">
              <div class="text-gray-500">벤더 공급가</div>
              <div class="font-mono font-bold">${fmt(s.vendor)}원</div>
            </div>
            <div class="bg-gray-50 rounded p-2">
              <div class="text-gray-500">캠핑장 납품가</div>
              <div class="font-mono font-bold">${fmt(s.campSupply)}원</div>
            </div>
            <div class="bg-gray-50 rounded p-2">
              <div class="text-gray-500">온라인 판매가</div>
              <div class="font-mono font-bold">${fmt(s.online)}원</div>
            </div>
            <div class="bg-gray-50 rounded p-2">
              <div class="text-gray-500">오프라인 판매가</div>
              <div class="font-mono font-bold">${fmt(s.offline)}원</div>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-5 space-y-3">
        ${diffBlock('캠핑장 납품가', s.campSupply, '시스페이스 공급가', s.sysSupply, '#e3f2fd')}
        ${diffBlock('온라인 판매가', s.online, '쿠팡 판매가', s.coupang, '#fff3e0')}
        ${diffBlock('오프라인 판매가', s.offline, '시스페이스 권장가', s.sysMSRP, '#fce4ec')}
      </div>
    </div>
  `;
  modal.classList.remove('hidden');
  modal.addEventListener('click', hideSkuModal, { once: true });
}

  const modal = document.getElementById('skuModal');
  modal.className = 'hidden';
  modal.innerHTML = '';
}

function attachSimulationHandlers() {
  ['simRevenue','simNumCamps','simOnlineRatio','simCamfitShare','simBm','simOm','simOfm','simPgOn','simPgOff'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      simState.revenuePerCamp = parseFloat(document.getElementById('simRevenue').value) || 0;
      simState.numCamps = parseInt(document.getElementById('simNumCamps').value) || 1;
      simState.onlineRatio = parseFloat(document.getElementById('simOnlineRatio').value) || 0;
      simState.camfitShare = parseFloat(document.getElementById('simCamfitShare').value) || 0;
      simState.bm = parseFloat(document.getElementById('simBm').value) || 0;
      simState.om = parseFloat(document.getElementById('simOm').value) || 0;
      simState.ofm = parseFloat(document.getElementById('simOfm').value) || 0;
      simState.pgOn = parseFloat(document.getElementById('simPgOn').value) || 0;
      simState.pgOff = parseFloat(document.getElementById('simPgOff').value) || 0;
      updateSimResult();
    });
  });
  document.getElementById('simReset').addEventListener('click', () => {
    simState.bm = Math.round((allMargins.camfit || 0) * 100);
    simState.om = Math.round((allMargins.camp || 0) * 100);
    simState.ofm = Math.round((allMargins.offline || 0) * 100);
    document.getElementById('simBm').value = simState.bm;
    document.getElementById('simOm').value = simState.om;
    document.getElementById('simOfm').value = simState.ofm;
    updateSimResult();
  });
  updateSimResult();
}

function updateSimResult() {
  const R = simState.revenuePerCamp;
  const N = simState.numCamps;

function showSizeCostModal(tier) {
  const sizeLabel = { S: 'S 대형', A: 'A 중형', B: 'B 소형' }[tier];
  const headerColor = { S: '#bf360c', A: '#827717', B: '#1b5e20' }[tier];

  let list;
  if (tier === 'S') list = allSkus;
  else if (tier === 'A') list = allSkus.filter(s => ['B','A'].includes(s.tier));
  else list = allSkus.filter(s => s.tier === 'B');

  const received = list.filter(s => typeof s.boxPrice === 'number');
  const missing = list.filter(s => typeof s.boxPrice !== 'number');
  const totalCost = received.reduce((sum, s) => sum + s.boxPrice, 0);

  // 카테고리 → 상품명 순 정렬
  const sortFn = (a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name);

  // 카테고리별 소합계
  const byCat = {};
  received.forEach(s => {
    if (!byCat[s.category]) byCat[s.category] = { count: 0, sum: 0 };
    byCat[s.category].count++;
    byCat[s.category].sum += s.boxPrice;
  });
  const catRows = Object.entries(byCat)
    .sort((a,b) => b[1].sum - a[1].sum)
    .map(([c, d]) => `<tr>
      <td class="text-left">${categoryEmoji[c]||''} ${c}</td>
      <td>${d.count}종</td>

function computeInsight(list, cfg) {
  if (!list.length) return '';
  const nums = list.map(s => s[cfg.diffKey]);
  const avg = nums.reduce((a,b)=>a+b,0) / nums.length;
  const sortedDesc = [...list].sort((a,b) => b[cfg.diffKey] - a[cfg.diffKey]);
  const max = sortedDesc[0];
  const min = sortedDesc[sortedDesc.length - 1];

  // 카테고리별 평균
  const byCat = {};
  list.forEach(s => {
    if (!byCat[s.category]) byCat[s.category] = { sum:0, count:0 };
    byCat[s.category].sum += s[cfg.diffKey];
    byCat[s.category].count++;
  });
  const catAvgs = Object.entries(byCat).map(([c, d]) => ({c, avg: d.sum/d.count}));
  catAvgs.sort((a,b) => b.avg - a.avg);
  const topCat = catAvgs[0];

  const avgPct = (avg*100).toFixed(1);
  const avgWord = avg > 0 ? '비쌈' : '저렴';
  const avgColor = avg > 0 ? 'text-rose-600' : 'text-blue-600';

  return `
    <div class="rounded-xl p-4 mb-4 border border-gray-200" style="background: linear-gradient(to right, ${cfg.bg}, white);">
      <h3 class="text-sm font-bold text-gray-700 mb-2">💡 요약 인사이트</h3>
      <ul class="text-sm text-gray-700 space-y-1">
        <li>• 평균 차이: <b class="${avgColor}">${Math.abs(avg*100).toFixed(1)}% ${avgWord}</b></li>
        <li>• 가장 비쌈: <b>${max.name}</b> (▲ ${(max[cfg.diffKey]*100).toFixed(1)}%)</li>
        <li>• 가장 저렴: <b>${min.name}</b> (${min[cfg.diffKey] < 0 ? '▼' : '▲'} ${Math.abs(min[cfg.diffKey]*100).toFixed(1)}%)</li>
        <li>• 평균이 가장 비싼 카테고리: <b>${categoryEmoji[topCat.c]||''} ${topCat.c}</b> (평균 ${(topCat.avg*100).toFixed(1)}%)</li>
      </ul>
    </div>
  `;
}

  const cats = [...new Set(allSkus.filter(s => typeof s[cfg.diffKey] === 'number').map(s => s.category))];

  });
  catSel.value = filter.category;

  catSel.addEventListener('change', () => { filter.category = catSel.value; updateAnalysisView(type); });

function updateAnalysisView(type) {
  const cfg = getAnalysisConfig(type);
  const filter = analysisFilters[type];

  let list = allSkus.filter(s => typeof s[cfg.diffKey] === 'number');
  if (filter.category) list = list.filter(s => s.category === filter.category);

  // 정렬
  list.sort((a, b) => {
    if (filter.sort === 'diff-desc') return b[cfg.diffKey] - a[cfg.diffKey];
    return a[cfg.diffKey] - b[cfg.diffKey];
  });

  // 인사이트
  document.getElementById(`analysisInsight_${type}`).innerHTML = computeInsight(list, cfg);

  // KPI
  const good = list.filter(s => s[cfg.diffKey] < cfg.threshold).length;
  const bad = list.filter(s => s[cfg.diffKey] > cfg.threshold).length;
  document.getElementById(`analysisKpi_${type}`).outerHTML = `
    <div id="analysisKpi_${type}" class="grid grid-cols-3 gap-4 mb-4">
      ${kpiCard('비교 가능 SKU', list.length+'종', 'gray')}
      ${kpiCard(cfg.goodLabel, good+'종', 'blue')}
      ${kpiCard(cfg.badLabel, bad+'종', 'rose')}

  // 차트 (현재 필터/정렬 상태 그대로)
  document.getElementById(`analysisChartTitle_${type}`).textContent = `SKU별 격차 (${list.length}개)`;
  drawAnalysisChart(type, cfg, list);

  // 테이블
  const rows = list.map(s => `<tr>

}

function renderSizes() {
  // 사이즈별 SKU 집계
  const getTierSkus = (tier) => {
    if (tier === 'S') return allSkus;
    if (tier === 'A') return allSkus.filter(s => ['B','A'].includes(s.tier));
    return allSkus.filter(s => s.tier === 'B');
  };
  const computeCost = (tier) => {
    const list = getTierSkus(tier);
    const received = list.filter(s => typeof s.boxPrice === 'number');
    const missing = list.length - received.length;
    const sum = received.reduce((acc, s) => acc + s.boxPrice, 0);
    return { sum, count: list.length, received: received.length, missing };
  };
  const sizeData = { S: computeCost('S'), A: computeCost('A'), B: computeCost('B') };
  const fmtCost = (n) => n > 0 ? Math.round(n).toLocaleString('ko-KR') + '원' : '미산정';

  const card = (tier, sizeName, bgColor, textColor, valueColor) => {
    const d = sizeData[tier];
    return `

           style="background:${bgColor};"
           onclick="showSizeCostModal('${tier}')">

        <div class="text-xl font-bold mt-1" style="color:${valueColor};">${fmtCost(d.sum)}</div>
        <div class="text-xs mt-1" style="color:${textColor};">
          견적 수령 ${d.received}종${d.missing > 0 ? ` · <span class="font-semibold">미수령 ${d.missing}종 제외</span>` : ''}
        </div>
        <div class="text-xs text-gray-500 mt-2">▶ 클릭하면 상세 보기</div>
      </div>`;
  };

  return `

    <p class="text-sm text-gray-500 mb-4">캠핑장 규모(S 대형 / A 중형 / B 소형)에 맞춰 SKU 필터링</p>

function attachSizesHandlers() {
  // 카테고리 옵션
  const cats = [...new Set(allSkus.map(s => s.category))];
  const select = document.getElementById('categorySelectS');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = `${categoryEmoji[c] || ''} ${c}`;
    select.appendChild(opt);
  });
  document.querySelectorAll('.tier-btn-s').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTier = btn.dataset.tier;
      document.querySelectorAll('.tier-btn-s').forEach(b => {
        b.classList.remove('bg-orange-50','border-orange-300','text-orange-700');
        b.classList.add('border-transparent');
      });
      btn.classList.add('bg-orange-50','border-orange-300','text-orange-700');
      btn.classList.remove('border-transparent');
      renderSizeCards();
    });
  });
  ['searchInputS','categorySelectS','statusSelectS','sortSelectS'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderSizeCards);
    document.getElementById(id).addEventListener('change', renderSizeCards);
  });
  renderSizeCards();
}

function renderSizeCards() {
  const search = (document.getElementById('searchInputS').value||'').toLowerCase();
  const cat = document.getElementById('categorySelectS').value;
  const status = document.getElementById('statusSelectS').value;
  const sort = document.getElementById('sortSelectS').value;

  const tierIncludes = (sku) => {
    if (currentTier === 'S') return true;                                  // 대형 = 전체
    if (currentTier === 'A') return sku.tier === 'B' || sku.tier === 'A';  // 중형 = B + A
    if (currentTier === 'B') return sku.tier === 'B';                      // 소형 = B만
    return true;
  };

  let filtered = allSkus.filter(s =>
    tierIncludes(s) &&
    (!cat || s.category === cat) &&
    (!status || s.quoteStatus === status) &&
    (!search || s.name.toLowerCase().includes(search) || (s.brand||'').toLowerCase().includes(search))
  );
  if (sort === 'category') filtered.sort((a,b)=>a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  else if (sort === 'online-asc') filtered.sort((a,b)=>(a.online||0)-(b.online||0));
  else if (sort === 'online-desc') filtered.sort((a,b)=>(b.online||0)-(a.online||0));
  else if (sort === 'coupang-asc') filtered.sort((a,b)=>(a.vsCoupang||999)-(b.vsCoupang||999));

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = filtered.map(skuCard).join('');
  // 카드 클릭 → 모달
  grid.querySelectorAll('.sku-card').forEach((card, idx) => {
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => showSkuModal(filtered[idx]));
  });
  document.getElementById('emptyState').classList.toggle('hidden', filtered.length>0);
}

function tierBadges(tier) {
  const includes = { 'B': ['S','A','B'], 'A': ['S','A'], 'S': ['S'] };

  const badges = sizes.map(t => `<span class="badge tier-${t}" style="padding:1px 6px;font-size:10px;">${t}</span>`).join(' ');
  return `<div class="flex flex-col items-end gap-1"><div class="flex gap-1">${badges}</div><div class="text-[10px] text-gray-400">${label}</div></div>`;
}

function attachCamfitCalcHandlers() {
  const map = {ccCamps:'camps',ccPg:'pg',ccDeliver:'deliverPerCamp',ccB2bRate:'b2bRate',ccSpend:'avgSpend',ccResv:'resv',ccAdopt:'adopt',ccOnline:'online',ccRs:'rs'};
  const sync = () => {
    Object.entries(map).forEach(([k,v]) => {
      const el = document.getElementById(k);
      if (el) calcState[v] = parseNum(el.value);
    });
    const pay = document.getElementById('ccB2bPay');
    if (pay) calcState.b2bPay = pay.value;
    updateCamfitCalc();
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', sync);
  });
  const pay = document.getElementById('ccB2bPay');
  if (pay) pay.addEventListener('change', sync);
  attachNumFormat(['ccCamps','ccDeliver','ccSpend','ccResv']);
  sync();   // 브라우저 새로고침 시 입력칸 값이 복원될 수 있으므로 DOM → state로 먼저 맞춘다
}

function updateCamfitCalc() {
  const s = calcState;
  // A. 납품(B2B) 비즈니스 (독립)
  const deliverTot = s.deliverPerCamp * s.camps;        // 납품 총액
  const b2bGross   = deliverTot * s.b2bRate/100;        // 캠핏 납품 마진(gross)
  const b2bCard    = s.b2bPay === 'card';               // 납품대금 카드·PG 결제 여부
  const b2bPg      = b2bCard ? deliverTot * s.pg/100 : 0;  // 납품 결제 PG (계좌이체면 0)
  const b2bCost    = deliverTot - b2bGross;             // 원가·기타
  const b2bNet     = b2bGross - b2bPg;                  // 캠핏 납품 마진(순)

  // B. 오더앤픽 온라인 정산
  const GMV     = s.avgSpend * s.resv * s.camps * (s.adopt/100);  // 거래액
  const deliver = GMV / (1 + s.online/100);             // 온라인분 납품가(캠핑장 회수)
  const rsAmt   = GMV * s.rs/100;                       // 캠핑장 RS
  const onPg    = GMV * s.pg/100;                       // 온라인 PG
  const onNet   = GMV - deliver - rsAmt - onPg;         // 캠핏 온라인 마진
  const useRate = deliverTot > 0 ? (deliver/deliverTot)*100 : 0;  // 온라인 소진율 (납품 재고 중 온라인으로 나가는 비중)

  const total = b2bNet + onNet;                         // 캠핏 총 마진

  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const pct = (n,base) => base>0 ? ((n/base)*100).toFixed(1)+'%' : '-';
  const seg = (val,base,color) => (base>0 && val>0) ? `<div style="width:${Math.min(100,(val/base)*100)}%;background:${color};" class="h-full"></div>` : '';
  const warn = msg => `<p class="text-xs mt-2" style="color:#b91c1c;">⚠️ ${msg}</p>`;
  const chip = (color,label,val,base) => `<span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:${color}"></span>${label} ${won(val)} · ${pct(val,base)}</span>`;

  document.getElementById('calcResult').innerHTML = `
    <section class="bg-white rounded-xl shadow-sm p-5 mb-4">
      <h3 class="font-bold text-gray-900 mb-1">📦 납품(B2B) 비즈니스</h3>

function attachCamfitCalc3Handlers() {
  const map = {c3Supply:'supply', c3B2b:'b2bRate', c3Up:'upRate', c3OpFee:'opFee', c3Pg:'pg', c3DiscValue:'discValue',
               c3Camps:'camps', c3Deliver:'deliverPerCamp', c3Spend:'avgSpend', c3Resv:'resv', c3Adopt:'adopt'};
  const sync = () => {
    Object.entries(map).forEach(([k,v]) => {
      const el = document.getElementById(k);
      if (el) calcState3[v] = parseNum(el.value);
    });
    const r = document.getElementById('c3Round');
    if (r) calcState3.round = parseInt(r.value, 10);
    const bp = document.getElementById('c3B2bPay');
    if (bp) calcState3.b2bPay = bp.value;
    // 주체·방식이 바뀌면 입력칸 구성 자체가 달라지므로 다시 그린다
    const ds = document.getElementById('c3DiscSubject');
    if (ds && ds.value !== calcState3.discSubject) { calcState3.discSubject = ds.value; calcState3.discValue = 0; render(); return; }
    const dt = document.getElementById('c3DiscType');
    if (dt && dt.value !== calcState3.discType) { calcState3.discType = dt.value; calcState3.discValue = 0; render(); return; }
    updateCamfitCalc3();
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', sync);
  });
  ['c3Round','c3DiscSubject','c3DiscType','c3B2bPay'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', sync);
  });
  attachNumFormat(['c3Supply','c3Camps','c3Deliver','c3Spend','c3Resv', ...(calcState3.discType==='amount' ? ['c3DiscValue'] : [])]);
  sync();
}

function updateCamfitCalc3() {
  const s = calcState3;
  const box = document.getElementById('calc3Body');
  if (!box) return;

  const b       = s.opFee/100;
  const deliv   = s.supply * (1 + s.b2bRate/100);      // ② 캠핑장 납품가
  const rawP    = deliv * (1 + s.upRate/100);          // ③ 판매가(자릿수 처리 전)
  const price   = r10(rawP, s.round);
  const RM      = {2:'올림', 1:'반올림', 0:'미적용'}[s.round] || '올림';

  // ── 할인 (주체에 따라 서비스 이용료의 기준 금액이 달라진다)
  const hasDisc = s.discSubject !== 'none' && s.discValue > 0;
  const discRate= s.discType === 'rate' ? Math.min(s.discValue, 100) : 0;   // 정률은 100% 상한
  const discAmt = !hasDisc ? 0 : (s.discType === 'rate' ? price * discRate/100 : Math.min(s.discValue, price));
  const paid    = price - discAmt;                     // 캠퍼 실결제액
  //   캠핏 부담 → 정가 기준으로 정산, 할인은 캠핏이익금에서만 차감
  //   캠핑장 부담 → 내려간 실결제액 기준으로 정산 → 캠핑장 마진이 줄어듦
  const feeBase = s.discSubject === 'camp' ? paid : price;

  const fee     = feeBase * b;                         // 서비스 이용료
  const settle  = feeBase - fee;                       // ④ 캠핑장 정산가
  const cMargin = settle - deliv;                      // ⑤ 캠핑장 마진 (결과)
  const cmRate  = deliv > 0 ? cMargin/deliv*100 : 0;          // 납품가 대비
  const cmRateP = paid  > 0 ? cMargin/paid*100  : 0;          // 판매가(할인 시 실결제액) 대비
  const pg      = paid * s.pg/100;                     // PG는 항상 실결제액 기준
  const camfitOn= fee - pg - (s.discSubject === 'camfit' ? discAmt : 0);   // 캠핏이익금
  const camfitB2b = deliv - s.supply;                  // 캠핏 납품 마진
  const beUp    = (1/(1-b) - 1) * 100;                 // 캠핑장 마진 0이 되는 업률
  const theo    = ((1 + s.upRate/100) * (1 - b) - 1) * 100;

  const C = {sup:'#6b7280', camfit:'#7c3aed', camp:'#ea580c', price:'#2563eb', pg:'#db2777'};
  const w  = n => (Math.round(n*100)/100).toLocaleString('ko-KR') + '원';
  const w0 = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const seg = (v,base,c) => (base>0 && v>0) ? `<div style="width:${Math.min(100,(v/base)*100)}%;background:${c};" class="h-full"></div>` : '';
  const warn = m => `<p class="text-xs mt-2" style="color:#b91c1c;">⚠️ ${m}</p>`;
  const step = (no,label,formula,amount,color,sub,pctW) => `
    <div class="flex items-center gap-3 py-2.5">
      <div class="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold text-white leading-none" style="background:${color};">${no}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline justify-between gap-3">
          <div class="text-sm font-semibold text-gray-800 truncate">${label}</div>
          <div class="text-lg font-bold tabular-nums shrink-0" style="color:${color};">${amount}</div>
        </div>
        <div class="h-1.5 rounded-full mt-1.5" style="background:#e5e7eb;"><div class="h-full rounded-full" style="width:${pctW}%;background:${color};opacity:.55;"></div></div>
        <div class="flex items-baseline justify-between gap-3 mt-1">
          <div class="text-[11px] font-mono text-gray-400 truncate">${formula}</div>
          <div class="text-[11px] shrink-0" style="color:${color};">${sub}</div>
        </div>
      </div>
    </div>`;
  const leaf = (depth,label,amount,color,note,strong) => `
    <div class="flex items-center gap-2 py-1.5" style="padding-left:${depth*22}px;">
      ${depth ? `<span class="text-gray-300 font-mono text-xs shrink-0">└</span>` : ''}
      <span class="inline-block w-2.5 h-2.5 rounded-sm shrink-0" style="background:${color};"></span>
      <span class="text-xs ${strong?'font-bold text-gray-900':'text-gray-600'} shrink-0">${label}</span>
      <span class="flex-1 border-b border-dotted border-gray-200 mx-1"></span>
      <span class="text-sm ${strong?'font-bold':'font-semibold'} tabular-nums shrink-0" style="color:${color};">${amount}</span>
      ${note ? `<span class="text-[11px] text-gray-400 shrink-0 w-24 text-right">${note}</span>` : '<span class="w-24 shrink-0"></span>'}
    </div>`;

  const maxV = Math.max(price, deliv, settle, s.supply) || 1;

  box.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">가격이 만들어지는 과정</div>
        <div class="text-[11px] text-gray-500 mb-2">③에서 판매가를 먼저 확정합니다</div>
        <div class="divide-y divide-gray-100">
          ${step(1,'공급사 공급가','기준', w0(s.supply), C.sup, '', s.supply/maxV*100)}
          ${step(2,'캠핑장 납품가', `공급가 × (1 + ${s.b2bRate}%)`, w0(deliv), C.camfit, `캠핏 납품 마진 +${w0(camfitB2b)}`, deliv/maxV*100)}
          ${step(3,'온라인 판매가 <span class="text-[10px] font-normal px-1 rounded" style="background:#dbeafe;color:#1d4ed8;">입력</span>', `납품가 × (1 + ${s.upRate}%)${s.round?` → 10원 ${RM}`:''}`, w0(price), C.price, s.round?`${w(rawP)} ${RM}`:'', price/maxV*100)}
          ${hasDisc ? step(4,'캠퍼 실결제액 <span class="text-[10px] font-normal px-1 rounded" style="background:#fee2e2;color:#b91c1c;">할인</span>', `판매가 − 할인 ${w(discAmt)} (${s.discSubject==='camfit'?'캠핏':'캠핑장'} 부담)`, w(paid), '#b91c1c', `정가 대비 −${(discAmt/price*100).toFixed(1)}%`, paid/maxV*100) : ''}
          ${step(hasDisc?5:4,'캠핑장 정산가 <span class="text-[10px] font-normal px-1 rounded" style="background:#ffedd5;color:#c2410c;">결과</span>', `${s.discSubject==='camp'?'실결제액':'판매가'} − 서비스 이용료(${s.opFee}%) = ${w(feeBase)} − ${w(fee)}`, w(settle), C.camp, `캠핑장 마진 ${cMargin>=0?'+':''}${w(cMargin)}`, settle/maxV*100)}
        </div>
      </div>

      <div class="rounded-xl border border-gray-200 p-4">
        <div class="text-sm font-bold text-gray-900 mb-1">${w0(price)}에서 이용료를 떼면</div>
        <div class="text-[11px] text-gray-500 mb-2">남은 금액에서 납품가를 빼면 캠핑장 마진</div>
        <div class="rounded-lg px-3 py-2 mb-1 flex items-center justify-between" style="background:#eff6ff;">
          <span class="text-xs font-bold" style="color:#1d4ed8;">캠퍼 결제${hasDisc?' (할인 후)':' (판매가)'}</span>
          <span class="text-lg font-bold tabular-nums" style="color:${C.price};">${w(paid)}</span>
        </div>
        ${hasDisc ? `<div class="text-[11px] mb-1 px-3" style="color:#b91c1c;">정가 ${w0(price)} − 할인 ${w(discAmt)} · <b>${s.discSubject==='camfit'?'캠핏':'캠핑장'} 부담</b> · 서비스 이용료는 <b>${s.discSubject==='camp'?'할인 후':'정가'}</b> 기준</div>` : ''}
        ${leaf(1,'서비스 이용료', w(fee), C.camfit, `${s.opFee}%`, true)}
        ${leaf(2,'PG', w(pg), C.pg, `${s.pg}%`, false)}
        ${s.discSubject==='camfit' && hasDisc ? leaf(2,'할인 부담 (캠핏)', '−'+w(discAmt), '#b91c1c', '', false) : ''}
        ${leaf(2,'캠핏이익금', w(camfitOn), C.camfit, paid>0?`${(camfitOn/paid*100).toFixed(2)}%`:'—', true)}
        ${leaf(1,'④ 캠핑장 정산가', w(settle), C.camp, `= 오더앤픽 공급가`, true)}
        ${leaf(2,'캠핑장 납품가 (원가 회수)', w0(deliv), C.sup, '', false)}
        ${leaf(2,'⑤ 캠핑장 마진', w(cMargin), C.camp, `납품가 ${cmRate.toFixed(2)}%`, true)}
        ${leaf(3, `<span class="text-gray-400">${hasDisc?'실결제액':'판매가'} 대비</span>`, `<span class="text-gray-500">${cmRateP.toFixed(2)}%</span>`, '#e5e7eb', '', false)}
      </div>
    </div>

    <div class="mt-4 rounded-xl p-4" style="background:#fffbeb;border:1px solid #fde68a;">
      <div class="text-xs font-bold text-gray-700 mb-2">⑤ 캠핑장 마진 <span class="font-normal text-gray-500">— 이 계산기의 결과값</span></div>
      <div class="flex items-baseline gap-3 flex-wrap">
        <span class="text-3xl font-extrabold tabular-nums" style="color:#c2410c;">${w(cMargin)}</span>
        <span class="text-lg font-bold" style="color:#ea580c;">납품가 대비 ${cmRate.toFixed(2)}%</span>
        <span class="text-lg font-bold" style="color:#2563eb;">${hasDisc?'실결제액':'판매가'} 대비 ${cmRateP.toFixed(2)}%</span>
        <span class="text-xs text-gray-500">= 캠핑장 정산가 ${w(settle)} − 캠핑장 납품가 ${w0(deliv)}</span>
      </div>
      ${hasDisc ? `<div class="text-xs mt-2" style="color:${s.discSubject==='camfit'?'#6d28d9':'#c2410c'};">
        ${s.discSubject==='camfit'
          ? `캠핏 할인이라 <b>캠핑장 마진은 그대로</b>입니다. 할인 ${w(discAmt)}은 캠핏이익금에서 빠집니다 (${w(fee-pg)} → <b>${w(camfitOn)}</b>).`
          : `캠핑장 할인이라 마진이 줄었습니다 — 할인 없을 때 ${w(price*(1-b)-deliv)} → <b>${w(cMargin)}</b>. 캠핏이익금도 이용료 기준이 내려가 ${w(price*b-pg)} → ${w(camfitOn)}로 소폭 감소합니다.`}
      </div>` : ''}
      <div class="text-xs text-gray-500 mt-2 font-mono">
        공식: 캠핑장 마진율 = (1 + 업률 ${s.upRate}%) × (1 − 이용료 ${s.opFee}%) − 1 = <b>${theo.toFixed(2)}%</b>${Math.abs(cmRate-theo)>0.005?` <span style="color:#b45309;">→ 10원 ${RM} 반영 후 ${cmRate.toFixed(2)}%</span>`:''}

      <div class="flex h-8 rounded-lg overflow-hidden border border-gray-200 mb-3">
        ${seg(s.supply,price,'#d1d5db')}${seg(camfitB2b,price,C.camfit)}${seg(cMargin,price,C.camp)}${seg(pg,price,C.pg)}${seg(camfitOn,price,'#3b82f6')}

          <div class="text-[11px] font-semibold" style="color:${C.pg};">PG사</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap" style="color:#9d174d;">${w(pg)}</div>
          <div class="text-[11px] text-pink-700 mt-0.5">캠핏 부담</div>
          <div class="text-[11px] text-gray-500">판매가의 ${s.pg}%</div>
        </div>
        <div class="rounded-lg p-3" style="background:#f3f4f6;">
          <div class="text-[11px] font-semibold text-gray-600">공급사</div>
          <div class="text-lg font-bold tabular-nums whitespace-nowrap text-gray-700">${w0(s.supply)}</div>

          <div class="text-[11px] text-gray-500">판매가의 ${(s.supply/price*100).toFixed(2)}%</div>
        </div>

    </div>

    <div class="mt-3 rounded-lg px-3 py-2 text-xs" style="background:${s.upRate>=beUp?'#f0fdf4':'#fef2f2'};color:${s.upRate>=beUp?'#15803d':'#b91c1c'};">
      캠핑장 마진 0이 되는 업률 = 1 ÷ (1 − ${s.opFee}%) − 1 = <b>${beUp.toFixed(2)}%</b> · 현재 업률 <b>${s.upRate}%</b> → ${s.upRate>=beUp?'✅ 캠핑장 마진 확보':'❌ 캠핑장 마이너스'}
    </div>
    ${hasDisc && discAmt >= price ? warn('할인액이 <b>판매가 이상</b>입니다. 실결제액이 0원이 되어 정산이 성립하지 않습니다.') : ''}
    ${hasDisc && s.discType==='rate' && s.discValue > 100 ? warn(`정률 할인은 <b>100%</b>를 넘을 수 없습니다 — 100%로 계산했습니다.`) : ''}
    ${cMargin < 0 ? warn(`캠핑장 마진이 <b>마이너스</b>입니다. 업률을 <b>${beUp.toFixed(2)}%</b> 위로 올리거나 서비스 이용료율을 낮추세요.`) : ''}
    ${camfitOn < 0 ? warn(`서비스 이용료가 PG(${w(pg)})보다 작아 <b>캠핏이익금이 마이너스</b>입니다.`) : ''}
  `;

  // ── 월 단위 규모 : 단가에서 나온 비율을 그대로 스케일한다 (위·아래가 항상 일치)
  const mBox = document.getElementById('calc3Month');
  if (!mBox || paid <= 0) { if (mBox) mBox.innerHTML = ''; return; }

  const deliverTot = s.deliverPerCamp * s.camps;               // 납품 총액
  const b2bGross   = deliverTot * s.b2bRate/100;
  const b2bCard    = s.b2bPay === 'card';
  const b2bPg      = b2bCard ? deliverTot * s.pg/100 : 0;
  const b2bNet     = b2bGross - b2bPg;                         // 캠핏 납품 마진

  const GMV     = s.avgSpend * s.resv * s.camps * (s.adopt/100);   // 거래액 = 캠퍼 실결제 총액
  const k       = GMV / paid;                                      // 단가 → 월 스케일 계수
  const mDeliv  = deliv    * k;   // 캠핑장 구입원가 회수분
  const mCamp   = cMargin  * k;   // 캠핑장 마진
  const mFee    = fee      * k;   // 서비스 이용료
  const mPg     = pg       * k;   // 온라인 PG
  const mCamfit = camfitOn * k;   // 캠핏 온라인 마진
  const mDisc   = discAmt  * k;   // 할인 총액
  const useRate = deliverTot > 0 ? (mDeliv/deliverTot)*100 : 0;
  const total   = b2bNet + mCamfit;

  const card = (bg,color,label,val,sub) => `
    <div class="rounded-xl p-4" style="background:${bg};">
      <div class="text-xs font-semibold" style="color:${color};">${label}</div>
      <div class="text-2xl font-bold tabular-nums mt-1" style="color:${color};">${w0(val)}</div>
      <div class="text-xs mt-1" style="color:#4b5563;">${sub}</div>
    </div>`;

  mBox.innerHTML = `
    <div class="rounded-xl border border-gray-200 p-4 mb-3">
      <div class="text-sm font-bold text-gray-900 mb-2">📦 납품(B2B) — 캠핏이 사입해 캠핑장에 납품</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        ${card('#f3e8ff','#6d28d9','캠핏 납품 마진 (월)', b2bNet, `납품 총액 대비 ${(b2bNet/deliverTot*100).toFixed(1)}% · 연 ${w0(b2bNet*12)}`)}
        ${card('#f3f4f6','#374151','납품 총액 (월)', deliverTot, `${w0(s.deliverPerCamp)}/곳 × ${fmtNum(s.camps)}곳 · 결제 ${b2bCard?'카드·PG':'계좌이체(PG 없음)'}`)}
      </div>
    </div>

    <div class="rounded-xl border border-gray-200 p-4 mb-3">
      <div class="text-sm font-bold text-gray-900 mb-1">🛒 오더앤픽 온라인 (월)</div>
      <div class="text-[11px] text-gray-500 mb-2">거래액 ${w0(GMV)} = 캠퍼 ${w0(s.avgSpend)} × 예약 ${fmtNum(s.resv)}건 × ${fmtNum(s.camps)}곳 × 이용률 ${s.adopt}%${hasDisc?` · 할인 총액 ${w0(mDisc)} (${s.discSubject==='camfit'?'캠핏':'캠핑장'} 부담)`:''}</div>
      <div class="flex h-7 rounded-lg overflow-hidden border border-gray-200">
        ${seg(mDeliv,GMV,'#9ca3af')}${seg(mCamp,GMV,C.camp)}${seg(mPg,GMV,C.pg)}${seg(mCamfit,GMV,'#2563eb')}
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-gray-700">
        <span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:#9ca3af"></span>납품가 회수 ${w0(mDeliv)}</span>
        <span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:${C.camp}"></span>캠핑장 마진 ${w0(mCamp)}</span>
        <span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:${C.pg}"></span>PG ${w0(mPg)}</span>
        <span><span class="inline-block w-3 h-3 rounded-sm align-middle mr-1" style="background:#2563eb"></span>캠핏이익금 ${w0(mCamfit)}</span>
      </div>
      <p class="text-xs text-gray-500 mt-2">온라인 소진율 <b>${useRate.toFixed(1)}%</b> — 납품 총액 ${w0(deliverTot)} 중 ${w0(mDeliv)} 어치가 온라인으로 판매됩니다 (나머지는 매점 오프라인 판매).</p>
      ${useRate > 100 ? warn('온라인 판매분이 <b>납품 총액을 초과</b>합니다. 캠핑장당 납품금액을 올리거나 이용률·예약건수를 낮춰 주세요.') : ''}
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
        ${card('#e3f2fd','#1d4ed8','캠핏 온라인 마진 (월)', mCamfit, `거래액 대비 ${(mCamfit/GMV*100).toFixed(2)}% · 연 ${w0(mCamfit*12)}`)}
        ${card('#fff7ed','#c2410c','캠핑장 마진 (월)', mCamp, `1곳당 ${w0(mCamp/(s.camps||1))} · 연 ${w0(mCamp*12)} · 구입원가 별도 회수`)}
        ${card('#f5f3ff','#6d28d9','서비스 이용료 (월)', mFee, `거래액의 ${s.opFee}% · PG ${w0(mPg)} 포함`)}
      </div>
    </div>

    <div class="rounded-xl shadow-sm p-5" style="background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff;">
      <div class="text-sm" style="opacity:.85;">캠핏 총 마진 (📦 납품 + 🛒 온라인, 월)</div>
      <div class="text-3xl font-extrabold mt-1 tabular-nums">${w0(total)}</div>
      <div class="text-sm mt-2" style="opacity:.9;">납품 ${w0(b2bNet)} + 온라인 ${w0(mCamfit)} · 연 ${w0(total*12)}</div>
    </div>
  `;
}

// ===== 캠핏 마진 계산기 (서비스 이용료) — 숙소셀러 RS 폐지 버전 (2026-07-30 회의 반영) =====
const calcState2 = {
  camps: 50, pg: 3.3,                                          // 공통
  deliverPerCamp: 3000000, b2bRate: 10, b2bPay: 'transfer',    // 납품(B2B) — RS버전과 동일
  avgSpend: 30000, resv: 100, adopt: 20,                       // 오더앤픽 온라인 (거래액 산출)
  campMargin: 5,                                               // 캠핑장 마진율 (납품가 대비) — 단가 블록과 공유
  // 확정 산식(2026-07-30·31): 판매가에서 서비스 이용료 공제 → 캠핑장 정산. uRound 2=올림(캠핑장 마진 ≥ 목표 보장)
  uSupply: 1000, uOpFee: 8, uRound: 2,
  uMode: 'margin', uUpRate: 14.13,
  // 일반셀러(신선·직배) — B2B 납품 없음, 캠핑장은 보관비(RS)만 수취
  gSupply: 1000, gOpFee: 13, gRs: 5, gRound: 2   // uMode: margin=캠핑장 마진율 입력 / up=업률 입력(캠핑장 마진이 결과)
  // ※ 「온라인 판매가 마진율」은 입력이 아니라 결과값 = (1+campMargin) ÷ (1−uOpFee) − 1
};

// 숫자 입력칸 콤마 표시용 (type=number는 콤마를 못 그려서 text로 받고 직접 포맷)
const fmtNum   = n => (isFinite(n) ? Number(n).toLocaleString('ko-KR') : '');
const parseNum = v => parseFloat(String(v).replace(/,/g, '')) || 0;
// 금액·수량 입력칸에 콤마를 붙이고, 편집 중에는 계산만 갱신 → 포커스 아웃 때 다시 포맷
function attachNumFormat(ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.dataset.numFmt) return;
    el.dataset.numFmt = '1';
    el.addEventListener('blur', () => { el.value = fmtNum(parseNum(el.value)); });
  });
}

// 판매가 10원 단위 처리.  1=반올림(사사오입) / 2=올림(캠핑장 마진이 목표 이상 보장) / 0=미적용
function r10(x, mode) {
  if (mode === 2) return Math.ceil(x/10) * 10;
  if (mode === 0) return x;
  return Math.floor(x/10 + 0.5) * 10;
}

function renderCamfitCalc2() {
  const s = calcState2;
  // suffix가 %가 아니면 금액·수량 → 콤마 표시(text 입력)
  const inp = (id, label, val, step, suffix) => {
    const money = suffix !== '%';
    const attrs = money
      ? `type="text" inputmode="numeric" value="${fmtNum(val)}"`
      : `type="number" step="${step}" value="${val}"`;
    return `<div>
       <label class="block text-xs text-gray-500 mb-1">${label}</label>
       <div class="relative">
         <input id="${id}" ${attrs} class="w-full border border-gray-300 rounded-lg pl-3 pr-8 py-2 text-sm${money?' tabular-nums':''}" />
         <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 pointer-events-none">${suffix}</span>
       </div>
     </div>`;
  };
  const sel = (id, label, val, opts) =>
    `<div>
       <label class="block text-xs text-gray-500 mb-1">${label}</label>
       <select id="${id}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
         ${opts.map(o => `<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}
       </select>
     </div>`;
  return `
    <h1 class="text-2xl font-bold text-gray-900 mb-1">캠핏 마진 계산기 <span class="text-base font-semibold text-gray-400">(서비스 이용료)</span></h1>

               <div class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-700 flex items-center justify-between">
                 <span class="font-semibold">${(((1+s.uUpRate/100)*(1-s.uOpFee/100))-1).toFixed(4)*1 ? ((((1+s.uUpRate/100)*(1-s.uOpFee/100))-1)*100).toFixed(2) : '0.00'}</span>
                 <span class="text-xs text-gray-400">% · 업률에서 자동</span>
               </div>
             </div>`
          : inp('c2CampMargin','캠핑장 마진율 (납품가 대비)', s.campMargin, 0.5, '%')}

      </div>
      <p class="text-xs mt-2" style="color:#6b7280;">※ <b>「온라인 판매가 마진율」은 입력이 아니라 결과값</b>입니다 — 캠핑장 마진율과 서비스 이용료율이 정해지면 자동으로 결정됩니다 <span class="font-mono">(1+캠핑장마진) ÷ (1−서비스 이용료) − 1</span>.</p>
